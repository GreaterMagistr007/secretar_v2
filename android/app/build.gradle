apply plugin: 'com.android.application'

// Версия приложения — из package.json, единственного места, где она записана.
def packageJson = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))

android {
    namespace = "io.github.greatermagistr007.secretar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.greatermagistr007.secretar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Растёт на единицу с каждым выданным APK — иначе Android не поставит его поверх прежнего
        // (docs/mechanic_android.md, раздел «Версия»).
        versionCode 8
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Нативные библиотеки LiteRT-LM — около 22–26 МБ на каждую архитектуру. По умолчанию только
        // arm64-v8a (телефоны): с x86_64 APK выходит за предел 50 МБ отправки ботом Telegram.
        // Для эмулятора — SECRETAR_ABIS=arm64-v8a,x86_64 (docs/mechanic_android.md, раздел «Сборка»).
        ndk {
            abiFilters(*((System.getenv('SECRETAR_ABIS') ?: 'arm64-v8a').split(',')))
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Постоянный ключ подписи: обновление ставится поверх только при той же подписи (требование Т-29).
    // Ключ — release.keystore в корне проекта, пароли — из .env.android через docker compose;
    // оба файла вне git (docs/mechanic_android.md, раздел «Подпись»).
    signingConfigs {
        release {
            storeFile rootProject.file('../release.keystore')
            storePassword System.getenv('SECRETAR_KEYSTORE_PASSWORD')
            keyAlias System.getenv('SECRETAR_KEY_ALIAS')
            keyPassword System.getenv('SECRETAR_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Модель для голоса на устройстве (решение Р-34): LiteRT-LM вызывается из Java, Kotlin-плагин
    // Gradle не нужен — Kotlin-библиотеки приходят транзитивно (docs/mechanic_android.md).
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
