# Окружение разработки и сборки. Контейнеры работают от пользователя хоста,
# иначе node_modules/ и dist/ получаются с правами root.
# Запуск: env UID=$(id -u) GID=$(id -g) docker compose up dev
# Именно через `env`: в bash переменная UID только для чтения, и присваивание
# префиксом команды (UID=... docker compose ...) завершается ошибкой.
# Без переменных подставляется 1000:1000 — обычный первый пользователь Linux.
services:
  dev:
    build: .
    image: secretar-node
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  build:
    build: .
    image: secretar-node
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"

  check:
    build: .
    image: secretar-node
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/app
    command: sh -c "npm install && npm run check"

  # Сборка APK (требование Т-29) — два шага, запуск одной командой:
  #   env UID=$(id -u) GID=$(id -g) docker compose run --rm android
  # Первый шаг (android-web) собирает веб-часть в режиме capacitor и копирует её в android/,
  # второй — прогоняет JUnit-тесты и собирает подписанный APK в ./secretar.apk.
  # Пароли ключа подписи — в .env.android (вне git, имена — в .env.example), см. docs/mechanic_android.md.
  android-web:
    build: .
    image: secretar-node
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/.npm
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build:android && npx cap sync android"

  android:
    build:
      context: .
      dockerfile: Dockerfile.android
    image: secretar-android
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      android-web:
        condition: service_completed_successfully
    # Необязательный: без файла остальные сервисы compose работают, падает только подпись в Gradle.
    env_file:
      - path: .env.android
        required: false
    environment:
      HOME: /tmp
      GRADLE_USER_HOME: /gradle
      # Архитектуры нативных библиотек; для эмулятора — arm64-v8a,x86_64.
      SECRETAR_ABIS: ${SECRETAR_ABIS:-arm64-v8a}
    volumes:
      - .:/app
      - gradle-cache:/gradle
    command: >-
      sh -c "./gradlew --no-daemon test assembleRelease
      && cp app/build/outputs/apk/release/app-release.apk /app/secretar.apk"

  # Модель для голоса (решение Р-36, docs/mechanic_voice.md): файл Gemma 4 E2B, который приложение
  # докачивает в «Настройки → Голос» с компьютера в локальной сети.
  # Скачать с Hugging Face по закреплённой ревизии с проверкой SHA-256 в ./models
  # (файл с верной суммой повторно не качается, оборванная загрузка продолжается с места обрыва):
  #   env UID=$(id -u) GID=$(id -g) docker compose run --rm model-download
  # Раздать ./models по HTTP в локальной сети (только чтение, порт 8088, другой — MODEL_PORT=...);
  # перед стартом сам проверит файл через model-download и при необходимости скачает:
  #   env UID=$(id -u) GID=$(id -g) docker compose up -d model-server
  # Остановить раздачу: docker compose stop model-server
  model-download:
    image: alpine:3.22
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /models
    environment:
      MODEL_REPO: litert-community/gemma-4-E2B-it-litert-lm
      # Ревизия — commit hash репозитория (поле sha в API Hugging Face), сумма — lfs.oid файла на ней.
      MODEL_REVISION: 2e12bfd869b2962984f97a1f2a26807316d534cc
      MODEL_FILE: gemma-4-E2B-it.litertlm
      MODEL_SHA256: 181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c
      MODEL_SIZE: "2588147712"
    volumes:
      - ./models:/models
    command:
      - sh
      - -c
      - |
        if [ -f "$$MODEL_FILE" ] && echo "$$MODEL_SHA256  $$MODEL_FILE" | sha256sum -c -s; then
          echo "$$MODEL_FILE уже скачан, SHA-256 верна"
          exit 0
        fi
        # Готовый файл с неверной суммой (порча на диске) удаляется: иначе уже запущенная раздача
        # отдавала бы его до конца перекачки, а телефон принял бы его по размеру.
        rm -f "$$MODEL_FILE"
        # Оборванная загрузка (.part короче файла) остаётся для продолжения. Полный .part с неверной
        # суммой wget -c не перекачивает (сервер отвечает 416) — его удаляет проверка суммы ниже.
        if ! wget -c -O "$$MODEL_FILE.part" "https://huggingface.co/$$MODEL_REPO/resolve/$$MODEL_REVISION/$$MODEL_FILE" &&
          [ "$$(stat -c %s "$$MODEL_FILE.part" 2>/dev/null || echo 0)" -lt "$$MODEL_SIZE" ]; then
          exit 1
        fi
        if ! echo "$$MODEL_SHA256  $$MODEL_FILE.part" | sha256sum -c; then
          rm -f "$$MODEL_FILE.part"
          exit 1
        fi
        mv "$$MODEL_FILE.part" "$$MODEL_FILE"

  model-server:
    image: nginx:1.30.6-alpine
    depends_on:
      model-download:
        condition: service_completed_successfully
    ports:
      - "${MODEL_PORT:-8088}:80"
    volumes:
      - ./models:/usr/share/nginx/html:ro

volumes:
  gradle-cache:
