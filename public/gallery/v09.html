<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>09. Пастельные карточки / шапка с тенью</title>
<style>
  /* Вариант 09: пастельная палитра, скруглённая карточка-шапка с тенью, ячейки-карточки */
  :root{
    --bg:#f4f2fb;
    --surface:#ffffff;
    --line:#eae6f6;
    --text:#3b3550;
    --muted:#9a94b4;
    --accent:#8f7ee0;
    --accent-soft:#ece7fc;
    --pink:#f4a6c0;
    --mint:#8fd8c4;
    --sun:#f6c96b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.45 "Nunito",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  .screen{max-width:430px;min-width:320px;margin:0 auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 12px 28px;}

  /* Карточка-шапка */
  .head-card{
    background:var(--surface);border-radius:22px;padding:16px 16px 14px;
    box-shadow:0 10px 26px rgba(59,53,80,.10);
  }
  .head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .title-btn{
    border:0;background:var(--accent-soft);cursor:pointer;color:var(--accent);
    font-family:inherit;border-radius:16px;padding:10px 14px;
    display:flex;align-items:center;gap:8px;min-width:0;
  }
  .t-m{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .t-c{font-size:10px;opacity:.8;}
  .arrows{display:flex;gap:6px;flex:0 0 auto;}
  .arrow{
    width:34px;height:34px;border-radius:12px;border:0;background:var(--bg);
    color:var(--accent);cursor:pointer;font-size:15px;line-height:1;
  }
  .head-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
  .summary{font-size:12px;color:var(--muted);}
  .today-btn{
    border:0;border-radius:14px;background:var(--accent);color:#fff;
    font:inherit;font-size:12px;font-weight:800;padding:8px 14px;cursor:pointer;
    box-shadow:0 5px 12px rgba(143,126,224,.35);
  }

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin:18px 2px 8px;}
  .weekdays span{text-align:center;font-size:11px;font-weight:800;color:var(--muted);}
  .weekdays span.we{color:var(--pink);}

  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cell{
    aspect-ratio:1/1.2;background:var(--surface);border-radius:14px;
    box-shadow:0 3px 8px rgba(59,53,80,.06);
    display:flex;flex-direction:column;align-items:center;padding:6px 3px 5px;gap:4px;
    font-size:14px;font-weight:700;
  }
  .cell.out{background:transparent;box-shadow:none;color:#cdc7e0;font-weight:400;}
  .cell.we:not(.out){color:var(--pink);}
  .cell.today{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(143,126,224,.4);}
  .strips{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 4px;}
  .strip{height:4px;border-radius:3px;background:var(--accent);}
  .strip.p{background:var(--pink);}
  .strip.m{background:var(--mint);}
  .strip.s{background:var(--sun);}
  .cell.today .strip{background:rgba(255,255,255,.85);}

  .legend{display:flex;gap:12px;flex-wrap:wrap;margin:18px 6px 0;font-size:11px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:14px;height:4px;border-radius:3px;display:inline-block;}

  /* Модалка */
  .overlay{position:fixed;inset:0;background:rgba(59,53,80,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:20;}
  .overlay.open{display:flex;}
  .dialog{width:100%;max-width:365px;background:var(--surface);border-radius:26px;padding:20px;box-shadow:0 24px 50px rgba(59,53,80,.3);}
  .d-title{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center;}
  .y-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:16px;padding:6px 10px;margin-bottom:14px;}
  .y-btn{width:32px;height:32px;border-radius:12px;border:0;background:var(--surface);color:var(--accent);cursor:pointer;font-size:15px;}
  .y-val{font-size:18px;font-weight:800;}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pick{padding:13px 2px;border-radius:14px;border:0;background:var(--bg);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .pick.now{background:var(--accent-soft);color:var(--accent);}
  .pick.active{background:var(--accent);color:#fff;box-shadow:0 6px 14px rgba(143,126,224,.35);}
  .ghost{width:100%;margin-top:16px;padding:13px;border-radius:16px;border:0;background:var(--bg);color:var(--muted);font:inherit;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="screen">
  <div class="head-card">
    <div class="head-top">
      <button class="title-btn" id="titleBtn" type="button">
        <span class="t-m" id="titleMonth">—</span>
        <span class="t-c">&#9660;</span>
      </button>
      <div class="arrows">
        <button class="arrow" id="prev" type="button" aria-label="Предыдущий месяц">&#8249;</button>
        <button class="arrow" id="next" type="button" aria-label="Следующий месяц">&#8250;</button>
      </div>
    </div>
    <div class="head-bottom">
      <span class="summary" id="summary">—</span>
      <button class="today-btn" id="todayBtn" type="button">Сегодня</button>
    </div>
  </div>

  <div class="weekdays" id="weekdays"></div>
  <div class="days" id="days"></div>

  <div class="legend">
    <span><i style="background:#8f7ee0"></i>работа</span>
    <span><i style="background:#f4a6c0"></i>дом</span>
    <span><i style="background:#8fd8c4"></i>здоровье</span>
    <span><i style="background:#f6c96b"></i>важное</span>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
    <div class="d-title">Перейти к месяцу</div>
    <div class="y-row">
      <button class="y-btn" id="yearPrev" type="button" aria-label="Предыдущий год">&#8249;</button>
      <span class="y-val" id="yearVal">—</span>
      <button class="y-btn" id="yearNext" type="button" aria-label="Следующий год">&#8250;</button>
    </div>
    <div class="months" id="months"></div>
    <button class="ghost" id="cancelBtn" type="button">Отмена</button>
  </div>
</div>

<script>
(function(){
  var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var SHORT  = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  var WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var TONES = ['', 'p', 'm', 's'];

  var today = new Date();
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var pickerYear = view.y;

  // Детерминированные демо-задачи
  function tasksFor(y, m, d){
    var h = Math.abs((y * 43 + (m + 1) * 883 + d * 1861) * 37 % 100);
    if (h < 43) return 0;
    if (h < 69) return 1;
    if (h < 89) return 2;
    return 3;
  }
  function toneFor(m, d, i){ return TONES[Math.abs(d * 3 + (m + 1) * 5 + i * 7) % 4]; }

  function buildCells(y, m){
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var prevDim = new Date(y, m, 0).getDate();
    var cells = [], i, d;
    for (i = offset - 1; i >= 0; i--) cells.push({ d: prevDim - i, out: true });
    for (d = 1; d <= dim; d++) cells.push({ d: d, out: false });
    d = 1;
    while (cells.length % 7 !== 0) cells.push({ d: d++, out: true });
    return cells;
  }

  var daysEl = document.getElementById('days');
  var wdEl = document.getElementById('weekdays');

  WD.forEach(function(w, i){
    var s = document.createElement('span');
    s.textContent = w;
    if (i > 4) s.className = 'we';
    wdEl.appendChild(s);
  });

  function render(){
    document.getElementById('titleMonth').textContent = MONTHS[view.m] + ' ' + view.y;
    daysEl.innerHTML = '';
    var total = 0, busy = 0;
    buildCells(view.y, view.m).forEach(function(c, idx){
      var el = document.createElement('div');
      var cls = 'cell';
      if (c.out) cls += ' out';
      if (idx % 7 > 4) cls += ' we';
      var isToday = !c.out && c.d === today.getDate() && view.m === today.getMonth() && view.y === today.getFullYear();
      if (isToday) cls += ' today';
      el.className = cls;

      var num = document.createElement('span');
      num.textContent = c.d;
      el.appendChild(num);

      var strips = document.createElement('div');
      strips.className = 'strips';
      var n = c.out ? 0 : tasksFor(view.y, view.m, c.d);
      if (n > 0) { total += n; busy++; }
      for (var k = 0; k < n; k++) {
        var s = document.createElement('i');
        s.className = 'strip ' + toneFor(view.m, c.d, k);
        strips.appendChild(s);
      }
      el.appendChild(strips);
      daysEl.appendChild(el);
    });
    document.getElementById('summary').textContent = total + ' задач · занято дней: ' + busy;
  }

  function shift(delta){
    var m = view.m + delta;
    view.y += Math.floor(m / 12);
    view.m = ((m % 12) + 12) % 12;
    render();
  }

  document.getElementById('prev').addEventListener('click', function(){ shift(-1); });
  document.getElementById('next').addEventListener('click', function(){ shift(1); });
  document.getElementById('todayBtn').addEventListener('click', function(){
    view.y = today.getFullYear(); view.m = today.getMonth(); render();
  });

  /* Модалка выбора месяца */
  var overlay = document.getElementById('overlay');
  var monthsEl = document.getElementById('months');

  function renderPicker(){
    document.getElementById('yearVal').textContent = pickerYear;
    monthsEl.innerHTML = '';
    MONTHS.forEach(function(name, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = SHORT[i];
      var cls = 'pick';
      if (i === today.getMonth() && pickerYear === today.getFullYear()) cls += ' now';
      if (i === view.m && pickerYear === view.y) cls += ' active';
      b.className = cls;
      b.addEventListener('click', function(){
        view.y = pickerYear; view.m = i; closeModal(); render();
      });
      monthsEl.appendChild(b);
    });
  }

  function openModal(){ pickerYear = view.y; renderPicker(); overlay.classList.add('open'); }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('titleBtn').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('yearPrev').addEventListener('click', function(){ pickerYear--; renderPicker(); });
  document.getElementById('yearNext').addEventListener('click', function(){ pickerYear++; renderPicker(); });
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
