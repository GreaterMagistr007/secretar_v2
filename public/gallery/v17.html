<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>17. Брутализм / чёрно-жёлтый моноширинный</title>
<style>
  :root{
    --bg:#f4f2e9; --ink:#0a0a0a; --yellow:#ffe000; --yellow-d:#e0c300;
    --red:#e03c00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  }
  .phone{max-width:420px;margin:0 auto;min-height:100vh;padding:14px 12px 26px}

  .hdr{border:3px solid var(--ink);background:var(--yellow);box-shadow:6px 6px 0 var(--ink);margin-bottom:18px}
  .hdr .top{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 10px;border-bottom:3px solid var(--ink);font-size:10px;font-weight:700;letter-spacing:1px;
  }
  .month-btn{
    display:block;width:100%;background:transparent;border:0;padding:12px 10px 14px;
    font:inherit;color:var(--ink);cursor:pointer;text-align:left;
  }
  .month-btn .m{display:block;font-size:27px;font-weight:800;text-transform:uppercase;letter-spacing:-1px;line-height:1}
  .month-btn .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .month-btn .y{font-size:15px;font-weight:700;letter-spacing:3px}
  .month-btn .tap{
    font-size:10px;font-weight:700;border:2px solid var(--ink);padding:3px 7px;background:#fff;letter-spacing:.5px;
  }

  .wd{display:grid;grid-template-columns:repeat(7,1fr);border:3px solid var(--ink);border-bottom:0;background:var(--ink)}
  .wd span{
    text-align:center;padding:6px 0;font-size:10px;font-weight:800;color:var(--yellow);letter-spacing:.5px;
  }
  .wd span.we{color:var(--red)}

  .grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--ink);gap:2px;padding:2px;
  }
  .cell{
    aspect-ratio:1/1.1;border:0;background:#fff;font:inherit;color:var(--ink);cursor:pointer;padding:3px 4px;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  }
  .cell .n{font-size:14px;font-weight:700;line-height:1}
  .cell.out{background:#dedbd1}
  .cell.out .n{color:#8d8a80}
  .cell.today{background:var(--yellow)}
  .cell.today .n{font-size:16px;font-weight:800;text-decoration:underline;text-decoration-thickness:3px}
  .cell.sel{outline:3px solid var(--red);outline-offset:-3px}
  .tag{
    font-size:9px;font-weight:800;line-height:1;padding:2px 3px;background:var(--ink);color:var(--yellow);
    align-self:stretch;text-align:center;letter-spacing:.3px;
  }
  .tag.hot{background:var(--red);color:#fff}
  .tag.none{background:transparent;color:transparent}

  .panel{margin-top:18px;border:3px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink)}
  .panel .ph{
    background:var(--ink);color:var(--yellow);padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:1px;
    display:flex;justify-content:space-between;
  }
  .panel ul{list-style:none;margin:0;padding:0}
  .panel li{padding:9px 10px;border-bottom:2px solid var(--ink);font-size:12px;display:flex;gap:8px;align-items:center}
  .panel li:last-child{border-bottom:0}
  .panel li b{background:var(--yellow);padding:1px 4px;border:2px solid var(--ink);font-size:10px;font-weight:800}
  .panel .none{padding:14px 10px;font-size:12px;font-weight:700}
  .actions{display:flex;gap:10px;margin-top:18px}
  .actions button{
    flex:1;border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:12px;
    font:inherit;font-size:12px;font-weight:800;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;
  }
  .actions button.y{background:var(--yellow)}

  .overlay{position:fixed;inset:0;background:rgba(10,10,10,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .overlay.open{display:flex}
  .dialog{width:100%;max-width:360px;background:#fff;border:4px solid var(--ink);box-shadow:10px 10px 0 var(--yellow)}
  .dialog .dh{background:var(--ink);color:var(--yellow);padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:1px}
  .year{display:flex;align-items:stretch;border-bottom:3px solid var(--ink)}
  .nav{
    width:56px;border:0;border-right:3px solid var(--ink);background:var(--yellow);
    font:inherit;font-size:20px;font-weight:800;cursor:pointer;color:var(--ink);
  }
  .nav.r{border-right:0;border-left:3px solid var(--ink)}
  .year b{flex:1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;letter-spacing:3px}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;background:var(--ink)}
  .months button{
    padding:14px 2px;border:0;background:#fff;font:inherit;font-size:12px;font-weight:800;
    text-transform:uppercase;cursor:pointer;color:var(--ink);
  }
  .months button.cur{background:var(--ink);color:var(--yellow)}
  .months button.now{background:var(--yellow)}
  .cancel{
    width:100%;padding:13px;border:0;border-top:3px solid var(--ink);background:#fff;
    font:inherit;font-size:12px;font-weight:800;text-transform:uppercase;cursor:pointer;letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="phone">
  <header class="hdr">
    <div class="top"><span>СЕКРЕТАРЬ // КАЛЕНДАРЬ</span><span id="todayStamp"></span></div>
    <button class="month-btn" id="monthBtn" aria-haspopup="dialog">
      <span class="m" id="mName">—</span>
      <span class="row"><span class="y" id="mYear"></span><span class="tap">[ СМЕНИТЬ ]</span></span>
    </button>
  </header>

  <div class="wd" id="wd"></div>
  <div class="grid" id="grid"></div>

  <div class="panel">
    <div class="ph"><span id="pDate">—</span><span id="pCount"></span></div>
    <ul id="tasks"></ul>
  </div>

  <div class="actions">
    <button id="todayBtn" class="y">Сегодня</button>
    <button id="pickBtn">Месяц</button>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="dialog">
    <div class="dh">ПЕРЕЙТИ К МЕСЯЦУ</div>
    <div class="year">
      <button class="nav" id="prevYear" aria-label="Предыдущий год">&lt;</button>
      <b id="pickYear">2026</b>
      <button class="nav r" id="nextYear" aria-label="Следующий год">&gt;</button>
    </div>
    <div class="months" id="months"></div>
    <button class="cancel" id="cancelBtn">Отмена</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var SHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  var WD=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
  var TITLES=["СОЗВОН 10:00","ОТЧЁТ","ЗАБРАТЬ ЗАКАЗ","ТРЕНИРОВКА","ОПЛАТИТЬ СЧЕТА",
              "РЕВЬЮ КОДА","ВРАЧ 15:30","ЗВОНОК КЛИЕНТУ","ЗАКУПКА","ПОЧТА"];

  function hash(y,m,d,salt){
    var x=((y*12+m)*32+d)*67+(salt||0);
    x=(x*2654435761)%4294967296; x=x^(x>>>7);
    return Math.abs(x)%100003;
  }
  function count(y,m,d){ var h=hash(y,m,d,1); return (h%100<42)?0:1+(h%4); }
  function isHot(y,m,d){ return hash(y,m,d,11)%7===0; }
  function tasksOf(y,m,d){
    var c=count(y,m,d), out=[];
    for(var i=0;i<c;i++){
      var k=hash(y,m,d,20+i*3);
      out.push(TITLES[k%TITLES.length]);
    }
    return out;
  }
  function pad(n){ return n<10?"0"+n:""+n; }

  var today=new Date();
  var todayKey=today.getFullYear()+"-"+today.getMonth()+"-"+today.getDate();
  var viewY=today.getFullYear(), viewM=today.getMonth();
  var selY=viewY, selM=viewM, selD=today.getDate(), pickYear=viewY;

  var $=function(id){return document.getElementById(id);};
  var grid=$("grid"), overlay=$("overlay");

  $("todayStamp").textContent=pad(today.getDate())+"."+pad(today.getMonth()+1)+"."+today.getFullYear();
  (function(){
    var h="";
    for(var i=0;i<7;i++) h+='<span class="'+(i>4?"we":"")+'">'+WD[i]+'</span>';
    $("wd").innerHTML=h;
  })();

  function render(){
    $("mName").textContent=MONTHS[viewM];
    $("mYear").textContent=viewY;

    var offset=(new Date(viewY,viewM,1).getDay()+6)%7;
    var start=new Date(viewY,viewM,1-offset);
    var days=new Date(viewY,viewM+1,0).getDate();
    var cells=Math.ceil((offset+days)/7)*7;

    grid.innerHTML="";
    for(var i=0;i<cells;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      var y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
      var key=y+"-"+m+"-"+n, out=m!==viewM;
      var b=document.createElement("button");
      b.type="button";
      b.className="cell"+(out?" out":"")+(key===todayKey?" today":"")
        +(y===selY&&m===selM&&n===selD?" sel":"");
      var c=count(y,m,n);
      var tag=c? '<span class="tag'+(isHot(y,m,n)?" hot":"")+'">'+c+'</span>'
               : '<span class="tag none">0</span>';
      b.innerHTML='<span class="n">'+pad(n)+'</span>'+tag;
      b.dataset.y=y; b.dataset.m=m; b.dataset.d=n;
      grid.appendChild(b);
    }
    renderPanel();
  }

  function renderPanel(){
    var list=tasksOf(selY,selM,selD);
    $("pDate").textContent=pad(selD)+"."+pad(selM+1)+"."+selY;
    $("pCount").textContent=list.length+" ЗАДАЧ";
    var ul=$("tasks");
    if(!list.length){ ul.innerHTML='<li class="none">ПУСТО. ДЕНЬ СВОБОДЕН.</li>'; return; }
    var h="";
    for(var i=0;i<list.length;i++) h+='<li><b>'+pad(i+1)+'</b>'+list[i]+'</li>';
    ul.innerHTML=h;
  }

  grid.addEventListener("click",function(e){
    var b=e.target.closest(".cell");
    if(!b) return;
    selY=+b.dataset.y; selM=+b.dataset.m; selD=+b.dataset.d;
    if(selM!==viewM||selY!==viewY){ viewY=selY; viewM=selM; }
    render();
  });

  $("todayBtn").addEventListener("click",function(){
    viewY=today.getFullYear(); viewM=today.getMonth();
    selY=viewY; selM=viewM; selD=today.getDate(); render();
  });

  function renderMonths(){
    $("pickYear").textContent=pickYear;
    var h="";
    for(var i=0;i<12;i++){
      var cls="";
      if(pickYear===viewY&&i===viewM) cls="cur";
      else if(pickYear===today.getFullYear()&&i===today.getMonth()) cls="now";
      h+='<button type="button" class="'+cls+'" data-m="'+i+'">'+SHORT[i]+'</button>';
    }
    $("months").innerHTML=h;
  }
  function open(){ pickYear=viewY; renderMonths(); overlay.classList.add("open"); }
  function close(){ overlay.classList.remove("open"); }

  $("monthBtn").addEventListener("click",open);
  $("pickBtn").addEventListener("click",open);
  $("prevYear").addEventListener("click",function(){pickYear--;renderMonths();});
  $("nextYear").addEventListener("click",function(){pickYear++;renderMonths();});
  $("cancelBtn").addEventListener("click",close);
  $("months").addEventListener("click",function(e){
    var b=e.target.closest("button[data-m]");
    if(!b) return;
    viewY=pickYear; viewM=+b.dataset.m; selY=viewY; selM=viewM;
    selD=(viewY===today.getFullYear()&&viewM===today.getMonth())?today.getDate():1;
    close(); render();
  });
  overlay.addEventListener("click",function(e){ if(e.target===overlay) close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });

  render();
})();
</script>
</body>
</html>
