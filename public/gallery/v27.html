<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>27. Высокий контраст / крупная доступная сетка</title>
<style>
  /* Вариант 27 — высокий контраст: крупный шрифт, жирные границы, чёрно-белое с одним акцентом */
  :root{
    --bg:#fff; --ink:#000; --accent:#ffd400; --accentInk:#000; --muted:#666;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden;font-size:18px;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600}
  .wrap{max-width:430px;margin:0 auto;padding:16px 12px 40px}
  /* Шапка с месяцем — очень заметная */
  .head{width:100%;border:4px solid var(--ink);background:var(--accent);color:var(--accentInk);
    padding:18px 16px;cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .head .m{font-size:32px;font-weight:900;line-height:1.05;text-transform:uppercase;letter-spacing:-.5px}
  .head .y{font-size:20px;font-weight:800;margin-top:4px}
  .head .arrow{font-size:30px;font-weight:900;flex:none}
  .hint{border:4px solid var(--ink);border-top:0;padding:10px 16px;font-size:15px;font-weight:700;background:#fff}
  .wd{display:grid;grid-template-columns:repeat(7,1fr);margin-top:16px;border:4px solid var(--ink);border-bottom:0}
  .wd div{text-align:center;padding:8px 0;font-size:14px;font-weight:900;text-transform:uppercase;
    border-right:2px solid var(--ink);background:var(--ink);color:#fff}
  .wd div:last-child{border-right:0}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);border:4px solid var(--ink)}
  .cell{min-height:58px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:20px;font-weight:800;background:#fff}
  .cell:nth-child(7n){border-right:0}
  .cell.out{background:#f0f0f0;color:#9a9a9a;font-weight:600}
  .cell.today{background:var(--accent);outline:4px solid var(--ink);outline-offset:-4px;font-weight:900}
  .n{font-size:13px;font-weight:900;background:var(--ink);color:#fff;border-radius:2px;padding:1px 6px;min-height:17px;line-height:15px}
  .cell.today .n{background:#000;color:var(--accent)}
  .n.zero{visibility:hidden}
  .foot{margin-top:16px;border:4px solid var(--ink);padding:12px 14px;font-size:16px;line-height:1.5}
  .foot .k{display:flex;justify-content:space-between;padding:4px 0}
  .foot .k b{font-weight:900}
  .tbtn{margin-top:14px;width:100%;border:4px solid var(--ink);background:var(--ink);color:#fff;
    padding:16px;font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  /* Модалка */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
  .ovl.on{display:flex}
  .dlg{width:100%;max-width:400px;background:#fff;border:5px solid var(--ink)}
  .dlg h2{margin:0;padding:12px 14px;background:var(--ink);color:#fff;font-size:17px;text-transform:uppercase;letter-spacing:.08em}
  .ynav{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--ink)}
  .ynav b{font-size:26px;font-weight:900}
  .ynav button{width:64px;height:60px;border:0;border-right:4px solid var(--ink);background:var(--accent);
    font-size:28px;font-weight:900;cursor:pointer;font-family:inherit}
  .ynav button:last-child{border-right:0;border-left:4px solid var(--ink)}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr)}
  .mgrid button{border:0;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);background:#fff;
    padding:15px 6px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;text-transform:uppercase}
  .mgrid button:nth-child(even){border-right:0}
  .mgrid button.cur{background:var(--accent);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
  .cancel{width:100%;border:0;background:#fff;padding:16px;font-size:18px;font-weight:900;
    text-transform:uppercase;cursor:pointer;font-family:inherit;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <button class="head" id="head" aria-haspopup="dialog">
    <span><span class="m" id="hMonth"></span><span class="y" id="hYear" style="display:block"></span></span>
    <span class="arrow">▾</span>
  </button>
  <div class="hint">Нажмите заголовок — выбор месяца</div>
  <div class="wd" id="wd"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <div class="k"><span>Всего задач</span><b id="s1"></b></div>
    <div class="k"><span>Дней с задачами</span><b id="s2"></b></div>
    <div class="k"><span>Сегодня</span><b id="s3"></b></div>
  </div>
  <button class="tbtn" id="tbtn">Сегодня</button>
</div>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="dlg">
    <h2>Выбор месяца</h2>
    <div class="ynav">
      <button id="prevY" aria-label="Предыдущий год">‹</button>
      <b id="yLbl"></b>
      <button id="nextY" aria-label="Следующий год">›</button>
    </div>
    <div class="mgrid" id="mgrid"></div>
    <button class="cancel" id="cancel">Отмена</button>
  </div>
</div>

<script>
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const today=new Date();
  let vy=today.getFullYear(), vm=today.getMonth(), pickY=vy;

  function rnd(y,m,d){const x=Math.sin((y*12+m)*19.7+d*6.53)*10000;return x-Math.floor(x);}
  function tasks(y,m,d){const r=rnd(y,m,d);return r<.5?0:1+Math.floor(r*10)%4;}

  document.getElementById('wd').innerHTML=WD.map(d=>'<div>'+d+'</div>').join('');

  function draw(){
    document.getElementById('hMonth').textContent=MONTHS[vm];
    document.getElementById('hYear').textContent=vy;
    const off=(new Date(vy,vm,1).getDay()+6)%7;
    const dim=new Date(vy,vm+1,0).getDate(), pdim=new Date(vy,vm,0).getDate();
    let html='',total=0,busy=0;
    for(let i=off-1;i>=0;i--) html+='<div class="cell out">'+(pdim-i)+'<span class="n zero">0</span></div>';
    for(let d=1;d<=dim;d++){
      const t=tasks(vy,vm,d); total+=t; if(t)busy++;
      const isT=(d===today.getDate()&&vm===today.getMonth()&&vy===today.getFullYear());
      html+='<div class="cell'+(isT?' today':'')+'">'+d+
            '<span class="n'+(t?'':' zero')+'">'+(t||0)+'</span></div>';
    }
    const rest=(7-((off+dim)%7))%7;
    for(let d=1;d<=rest;d++) html+='<div class="cell out">'+d+'<span class="n zero">0</span></div>';
    document.getElementById('grid').innerHTML=html;
    document.getElementById('s1').textContent=total;
    document.getElementById('s2').textContent=busy;
    document.getElementById('s3').textContent=today.getDate()+' '+MONTHS[today.getMonth()].toLowerCase();
  }

  function drawMonths(){
    document.getElementById('yLbl').textContent=pickY;
    document.getElementById('mgrid').innerHTML=MONTHS.map((m,i)=>
      '<button data-m="'+i+'" class="'+(i===vm&&pickY===vy?'cur':'')+'">'+m+'</button>').join('');
  }

  const ovl=document.getElementById('ovl');
  const open=()=>{pickY=vy;drawMonths();ovl.classList.add('on');};
  const close=()=>ovl.classList.remove('on');

  document.getElementById('head').addEventListener('click',open);
  document.getElementById('cancel').addEventListener('click',close);
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
  document.getElementById('prevY').addEventListener('click',()=>{pickY--;drawMonths();});
  document.getElementById('nextY').addEventListener('click',()=>{pickY++;drawMonths();});
  document.getElementById('mgrid').addEventListener('click',e=>{
    const b=e.target.closest('button[data-m]');if(!b)return;
    vm=+b.dataset.m;vy=pickY;draw();close();
  });
  document.getElementById('tbtn').addEventListener('click',()=>{vy=today.getFullYear();vm=today.getMonth();draw();});

  draw();
</script>
</body>
</html>
