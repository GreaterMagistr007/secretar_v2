<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18. Стекло / размытая шапка на градиенте</title>
<style>
  :root{
    --ink:#f2f0ff; --dim:rgba(242,240,255,.62); --faint:rgba(242,240,255,.3);
    --glass:rgba(255,255,255,.13); --stroke:rgba(255,255,255,.24);
    --accent:#8ef0d8; --accent2:#ffb3e6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;overflow-x:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#241a5e;
  }
  /* цветной фон-градиент с пятнами */
  .bgwrap{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#3b2a8c 0%,#5b31a8 42%,#2a2a78 100%);overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(56px);opacity:.75}
  .b1{width:280px;height:280px;background:#7a4dff;top:-70px;left:-60px}
  .b2{width:240px;height:240px;background:#22b5c9;bottom:120px;right:-80px}
  .b3{width:200px;height:200px;background:#ff5fae;bottom:-60px;left:20px;opacity:.55}

  .phone{max-width:420px;margin:0 auto;min-height:100vh;padding:0 14px 30px}

  /* полупрозрачная шапка с блюром поверх фона */
  .hdr{
    position:sticky;top:0;z-index:5;margin:0 -14px 14px;padding:16px 18px 14px;
    background:rgba(255,255,255,.11);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--stroke);
    display:flex;align-items:center;gap:12px;
  }
  .month-btn{
    background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;flex:1;
  }
  .month-btn .m{display:block;font-size:23px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
  .month-btn .y{display:block;font-size:12px;color:var(--dim);margin-top:2px;letter-spacing:1.5px;font-weight:600}
  .month-btn .m span{font-size:13px;color:var(--accent);margin-left:6px;vertical-align:middle}
  .today-btn{
    border:1px solid var(--stroke);background:var(--glass);color:var(--ink);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  }

  .card{
    background:var(--glass);border:1px solid var(--stroke);border-radius:22px;padding:14px 10px 16px;
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 16px 40px rgba(20,10,60,.35);
  }
  .wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px}
  .wd span{text-align:center;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.8px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{
    aspect-ratio:1;border:0;background:transparent;border-radius:13px;cursor:pointer;padding:0;
    font:inherit;color:var(--ink);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .cell .n{font-size:14px;font-weight:600;line-height:1}
  .cell.out .n{color:var(--faint)}
  .cell.has{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13)}
  .cell.today{background:rgba(142,240,216,.9);border:0}
  .cell.today .n{color:#173a35;font-weight:800}
  .cell.sel{box-shadow:0 0 0 1.5px var(--accent2)}
  .cell.sel.today{box-shadow:0 0 0 2px #fff}
  .dots{display:flex;gap:3px;height:4px}
  .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block}
  .dots i.p{background:var(--accent2)}
  .cell.today .dots i{background:#1d5a50}
  .cell.out .dots i{background:var(--faint)}

  .strip{
    margin-top:16px;display:flex;gap:10px;
  }
  .glassbox{
    flex:1;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:13px 14px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .glassbox b{display:block;font-size:20px;font-weight:700;line-height:1.1}
  .glassbox span{display:block;font-size:11px;color:var(--dim);margin-top:4px;line-height:1.4}

  .overlay{
    position:fixed;inset:0;background:rgba(20,12,50,.5);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:30;
  }
  .overlay.open{display:flex}
  .dialog{
    width:100%;max-width:350px;border-radius:24px;padding:18px;
    background:rgba(255,255,255,.14);border:1px solid var(--stroke);color:var(--ink);
    -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
    box-shadow:0 24px 60px rgba(15,8,45,.5);
  }
  .dialog h3{margin:0 0 14px;font-size:12px;font-weight:600;color:var(--dim);text-align:center;letter-spacing:1.4px;text-transform:uppercase}
  .year{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .year b{font-size:20px;font-weight:700;letter-spacing:2px}
  .nav{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--stroke);
    background:rgba(255,255,255,.1);color:var(--ink);font-size:17px;cursor:pointer;
  }
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .months button{
    padding:13px 2px;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.08);
    font:inherit;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .months button.cur{background:var(--accent);color:#173a35;font-weight:800}
  .months button.now{border-color:var(--accent2)}
  .cancel{
    width:100%;margin-top:14px;padding:13px;border-radius:15px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
  }
</style>
</head>
<body>
<div class="bgwrap"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<div class="phone">
  <header class="hdr">
    <button class="month-btn" id="monthBtn" aria-haspopup="dialog">
      <span class="m" id="mName">—<span>▾</span></span>
      <span class="y" id="mYear"></span>
    </button>
    <button class="today-btn" id="todayBtn">Сегодня</button>
  </header>

  <div class="card">
    <div class="wd" id="wd"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="strip">
    <div class="glassbox"><b id="sDay">—</b><span id="sSub"></span></div>
    <div class="glassbox"><b id="sMonth">0</b><span>задач в месяце</span></div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="dialog">
    <h3>Перейти к месяцу</h3>
    <div class="year">
      <button class="nav" id="prevYear" aria-label="Предыдущий год">‹</button>
      <b id="pickYear">2026</b>
      <button class="nav" id="nextYear" aria-label="Следующий год">›</button>
    </div>
    <div class="months" id="months"></div>
    <button class="cancel" id="cancelBtn">Отмена</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var SHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  var GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

  function hash(y,m,d,salt){
    var x=((y*12+m)*32+d)*71+(salt||0);
    x=(x*2654435761)%4294967296; x=x^(x>>>6);
    return Math.abs(x)%100003;
  }
  function count(y,m,d){ var h=hash(y,m,d,2); return (h%100<44)?0:1+(h%3); }
  function isPersonal(y,m,d){ return hash(y,m,d,17)%4===0; }

  var today=new Date();
  var todayKey=today.getFullYear()+"-"+today.getMonth()+"-"+today.getDate();
  var viewY=today.getFullYear(), viewM=today.getMonth();
  var selY=viewY, selM=viewM, selD=today.getDate(), pickYear=viewY;

  var $=function(id){return document.getElementById(id);};
  var grid=$("grid"), overlay=$("overlay");

  (function(){
    var h="";
    for(var i=0;i<7;i++) h+="<span>"+WD[i]+"</span>";
    $("wd").innerHTML=h;
  })();

  function render(){
    $("mName").innerHTML=MONTHS[viewM]+"<span>▾</span>";
    $("mYear").textContent=viewY;

    var offset=(new Date(viewY,viewM,1).getDay()+6)%7;
    var start=new Date(viewY,viewM,1-offset);
    var days=new Date(viewY,viewM+1,0).getDate();
    var cells=Math.ceil((offset+days)/7)*7;

    grid.innerHTML="";
    var total=0;
    for(var i=0;i<cells;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      var y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
      var out=m!==viewM, key=y+"-"+m+"-"+n, c=count(y,m,n);
      if(!out) total+=c;
      var b=document.createElement("button");
      b.type="button";
      b.className="cell"+(out?" out":"")+(c&&!out?" has":"")+(key===todayKey?" today":"")
        +(y===selY&&m===selM&&n===selD?" sel":"");
      var dots="", p=isPersonal(y,m,n);
      for(var k=0;k<Math.min(c,3);k++) dots+='<i class="'+(p&&k===0?"p":"")+'"></i>';
      b.innerHTML='<span class="n">'+n+'</span><span class="dots">'+dots+'</span>';
      b.dataset.y=y; b.dataset.m=m; b.dataset.d=n;
      grid.appendChild(b);
    }
    $("sMonth").textContent=total;
    updateDay();
  }

  function updateDay(){
    var c=count(selY,selM,selD);
    $("sDay").textContent=selD+" "+GEN[selM];
    $("sSub").textContent=c?(c+" задач(и) на день"+(isPersonal(selY,selM,selD)?", есть личные":"")):"задач нет";
  }

  grid.addEventListener("click",function(e){
    var b=e.target.closest(".cell");
    if(!b) return;
    selY=+b.dataset.y; selM=+b.dataset.m; selD=+b.dataset.d;
    if(selM!==viewM||selY!==viewY){ viewY=selY; viewM=selM; }
    render();
  });

  $("todayBtn").addEventListener("click",function(){
    viewY=today.getFullYear(); viewM=today.getMonth();
    selY=viewY; selM=viewM; selD=today.getDate(); render();
  });

  function renderMonths(){
    $("pickYear").textContent=pickYear;
    var h="";
    for(var i=0;i<12;i++){
      var cls="";
      if(pickYear===viewY&&i===viewM) cls="cur";
      else if(pickYear===today.getFullYear()&&i===today.getMonth()) cls="now";
      h+='<button type="button" class="'+cls+'" data-m="'+i+'">'+SHORT[i]+'</button>';
    }
    $("months").innerHTML=h;
  }
  function open(){ pickYear=viewY; renderMonths(); overlay.classList.add("open"); }
  function close(){ overlay.classList.remove("open"); }

  $("monthBtn").addEventListener("click",open);
  $("prevYear").addEventListener("click",function(){pickYear--;renderMonths();});
  $("nextYear").addEventListener("click",function(){pickYear++;renderMonths();});
  $("cancelBtn").addEventListener("click",close);
  $("months").addEventListener("click",function(e){
    var b=e.target.closest("button[data-m]");
    if(!b) return;
    viewY=pickYear; viewM=+b.dataset.m; selY=viewY; selM=viewM;
    selD=(viewY===today.getFullYear()&&viewM===today.getMonth())?today.getDate():1;
    close(); render();
  });
  overlay.addEventListener("click",function(e){ if(e.target===overlay) close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });

  render();
})();
</script>
</body>
</html>
