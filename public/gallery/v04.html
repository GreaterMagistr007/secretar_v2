<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>04. Мятный сад / сегментированный переключатель</title>
<style>
  /* Вариант 04: зелёная палитра, компактная шапка и сегменты «Месяц / Неделя / День» */
  :root{
    --bg:#f2f8f3;
    --surface:#ffffff;
    --line:#dbe9de;
    --text:#1e3326;
    --muted:#7d9a86;
    --accent:#2e8b57;
    --accent-soft:#dcefe3;
    --weekend:#8fae99;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  .screen{max-width:430px;min-width:320px;margin:0 auto;min-height:100vh;padding-bottom:24px;}

  .bar{
    display:flex;align-items:center;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  }
  .title-btn{
    border:0;background:transparent;padding:4px 6px 4px 0;cursor:pointer;
    color:inherit;font-family:inherit;display:flex;align-items:center;gap:6px;
  }
  .title-btn .t{font-size:19px;font-weight:700;letter-spacing:-0.3px;}
  .title-btn .c{font-size:11px;color:var(--accent);}
  .spacer{flex:1;}
  .mini{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);cursor:pointer;font-size:14px;line-height:1;
  }
  .today-btn{
    border:1px solid var(--accent);border-radius:9px;background:var(--accent-soft);
    color:var(--accent);font:inherit;font-size:12px;font-weight:600;
    padding:7px 12px;cursor:pointer;
  }

  /* Сегментированный переключатель (декоративный, активен «Месяц») */
  .segments{
    display:flex;background:var(--accent-soft);border-radius:11px;padding:3px;
    margin:6px 14px 12px;
  }
  .seg{
    flex:1;text-align:center;padding:9px 4px;border-radius:9px;
    font-size:13px;font-weight:600;color:var(--muted);border:0;background:transparent;
    font-family:inherit;cursor:default;
  }
  .seg.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(30,51,38,.12);}

  .sheet{margin:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);}
  .weekdays span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0 8px;}
  .weekdays span.we{color:#b4c9bb;}
  .days{gap:2px;}
  .cell{
    aspect-ratio:1/1.12;border-radius:9px;padding:4px 3px 3px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;
  }
  .cell.out{color:#c6d6cb;}
  .cell.we:not(.out){color:var(--weekend);}
  .cell.today{background:var(--accent);color:#fff;font-weight:700;}
  .chips{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center;}
  .chip{width:74%;height:3px;border-radius:2px;background:var(--accent);opacity:.8;}
  .chip.alt{background:#8fbf6e;}
  .chip.warn{background:#d8a33c;}
  .cell.today .chip{background:#fff;opacity:.9;}

  .hint{margin:14px 18px 0;font-size:12px;color:var(--muted);}

  /* Модалка */
  .overlay{position:fixed;inset:0;background:rgba(30,51,38,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;}
  .overlay.open{display:flex;}
  .dialog{width:100%;max-width:360px;background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 16px 40px rgba(30,51,38,.25);}
  .d-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:12px;}
  .y-row{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:11px;padding:6px 8px;margin-bottom:12px;}
  .y-btn{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface);color:var(--accent);cursor:pointer;font-size:14px;}
  .y-val{font-size:17px;font-weight:700;color:var(--accent);}
  .months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .pick{padding:12px 1px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:12px;cursor:pointer;}
  .pick.now{border-color:var(--accent);color:var(--accent);font-weight:600;}
  .pick.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .ghost{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="screen">
  <div class="bar">
    <button class="title-btn" id="titleBtn" type="button">
      <span class="t" id="titleMonth">—</span>
      <span class="c">&#9660;</span>
    </button>
    <span class="spacer"></span>
    <button class="mini" id="prev" type="button" aria-label="Предыдущий месяц">&#8249;</button>
    <button class="mini" id="next" type="button" aria-label="Следующий месяц">&#8250;</button>
    <button class="today-btn" id="todayBtn" type="button">Сегодня</button>
  </div>

  <div class="segments">
    <button class="seg on" type="button" tabindex="-1">Месяц</button>
    <button class="seg" type="button" tabindex="-1">Неделя</button>
    <button class="seg" type="button" tabindex="-1">День</button>
  </div>

  <div class="sheet">
    <div class="weekdays" id="weekdays"></div>
    <div class="days" id="days"></div>
  </div>

  <div class="hint">Полоски в ячейке — задачи дня: зелёная рабочая, оливковая личная, жёлтая важная.</div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
    <div class="d-title">Перейти к месяцу</div>
    <div class="y-row">
      <button class="y-btn" id="yearPrev" type="button" aria-label="Предыдущий год">&#8249;</button>
      <span class="y-val" id="yearVal">—</span>
      <button class="y-btn" id="yearNext" type="button" aria-label="Следующий год">&#8250;</button>
    </div>
    <div class="months" id="months"></div>
    <button class="ghost" id="cancelBtn" type="button">Отмена</button>
  </div>
</div>

<script>
(function(){
  var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var SHORT  = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  var WD = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
  var KINDS = ['', 'alt', 'warn'];

  var today = new Date();
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var pickerYear = view.y;

  // Детерминированные демо-задачи
  function tasksFor(y, m, d){
    var h = Math.abs((y * 1103515245 + (m + 1) * 12347 + d * 65537) % 100);
    if (h < 46) return 0;
    if (h < 72) return 1;
    if (h < 91) return 2;
    return 3;
  }
  function kindFor(y, m, d, i){
    return KINDS[Math.abs((d * 7 + (m + 1) * 3 + i * 5)) % 3];
  }

  function buildCells(y, m){
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var prevDim = new Date(y, m, 0).getDate();
    var cells = [], i, d;
    for (i = offset - 1; i >= 0; i--) cells.push({ d: prevDim - i, out: true });
    for (d = 1; d <= dim; d++) cells.push({ d: d, out: false });
    d = 1;
    while (cells.length % 7 !== 0) cells.push({ d: d++, out: true });
    return cells;
  }

  var daysEl = document.getElementById('days');
  var wdEl = document.getElementById('weekdays');

  WD.forEach(function(w, i){
    var s = document.createElement('span');
    s.textContent = w;
    if (i > 4) s.className = 'we';
    wdEl.appendChild(s);
  });

  function render(){
    document.getElementById('titleMonth').textContent = MONTHS[view.m] + ' ' + view.y;
    daysEl.innerHTML = '';
    buildCells(view.y, view.m).forEach(function(c, idx){
      var el = document.createElement('div');
      var cls = 'cell';
      if (c.out) cls += ' out';
      if (idx % 7 > 4) cls += ' we';
      var isToday = !c.out && c.d === today.getDate() && view.m === today.getMonth() && view.y === today.getFullYear();
      if (isToday) cls += ' today';
      el.className = cls;

      var num = document.createElement('span');
      num.textContent = c.d;
      el.appendChild(num);

      var chips = document.createElement('div');
      chips.className = 'chips';
      var n = c.out ? 0 : tasksFor(view.y, view.m, c.d);
      for (var k = 0; k < n; k++) {
        var chip = document.createElement('i');
        chip.className = 'chip ' + kindFor(view.y, view.m, c.d, k);
        chips.appendChild(chip);
      }
      el.appendChild(chips);
      daysEl.appendChild(el);
    });
  }

  function shift(delta){
    var m = view.m + delta;
    view.y += Math.floor(m / 12);
    view.m = ((m % 12) + 12) % 12;
    render();
  }

  document.getElementById('prev').addEventListener('click', function(){ shift(-1); });
  document.getElementById('next').addEventListener('click', function(){ shift(1); });
  document.getElementById('todayBtn').addEventListener('click', function(){
    view.y = today.getFullYear(); view.m = today.getMonth(); render();
  });

  /* Модалка выбора месяца */
  var overlay = document.getElementById('overlay');
  var monthsEl = document.getElementById('months');

  function renderPicker(){
    document.getElementById('yearVal').textContent = pickerYear;
    monthsEl.innerHTML = '';
    MONTHS.forEach(function(name, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = SHORT[i];
      var cls = 'pick';
      if (i === today.getMonth() && pickerYear === today.getFullYear()) cls += ' now';
      if (i === view.m && pickerYear === view.y) cls += ' active';
      b.className = cls;
      b.addEventListener('click', function(){
        view.y = pickerYear; view.m = i; closeModal(); render();
      });
      monthsEl.appendChild(b);
    });
  }

  function openModal(){ pickerYear = view.y; renderPicker(); overlay.classList.add('open'); }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('titleBtn').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('yearPrev').addEventListener('click', function(){ pickerYear--; renderPicker(); });
  document.getElementById('yearNext').addEventListener('click', function(){ pickerYear++; renderPicker(); });
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
