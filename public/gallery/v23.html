<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>23. Material 3 / скруглённые плашки</title>
<style>
  /* Вариант 23 — Material 3: surface-контейнеры, крупные скругления, таблетка «Сегодня» */
  :root{
    --bg:#fef7ff; --surf:#f3edf7; --surf2:#e8def8; --surf3:#ece6f0;
    --primary:#6750a4; --onPrimary:#fff; --primCont:#eaddff; --onPrimCont:#21005d;
    --tert:#2e6b4f; --tertCont:#bff0d6; --onTert:#08281a;
    --ink:#1d1b20; --dim:#49454f; --out:#cac4d0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:Roboto,-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:430px;margin:0 auto;padding:16px 14px 40px}
  /* Шапка-плашка с месяцем */
  .head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--primCont);color:var(--onPrimCont);border:0;border-radius:28px;padding:20px 22px;cursor:pointer;
    text-align:left;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .head .m{font-size:28px;font-weight:500;line-height:1.15}
  .head .y{font-size:14px;opacity:.8;margin-top:3px}
  .head .ic{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(103,80,164,.16);
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .board{margin-top:14px;background:var(--surf);border-radius:28px;padding:14px 10px 18px}
  .wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
  .wd div{text-align:center;font-size:12px;font-weight:500;color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{aspect-ratio:1;border-radius:16px;background:transparent;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font-size:15px;border:0;font-family:inherit;color:var(--ink);cursor:default}
  .cell.has{background:var(--surf3)}
  .cell.out{color:var(--out)}
  .cell.today{background:var(--primary);color:var(--onPrimary);font-weight:600}
  .pills{display:flex;gap:3px;height:6px;align-items:center}
  .pills i{display:block;width:6px;height:6px;border-radius:50%;background:var(--tert)}
  .cell.today .pills i{background:#fff}
  .chips{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{border-radius:999px;padding:9px 16px;font-size:14px;border:1px solid var(--out);background:none;color:var(--dim);font-family:inherit}
  .chip.filled{background:var(--tertCont);color:var(--onTert);border-color:transparent}
  .fab{margin-top:18px;width:100%;border:0;border-radius:999px;background:var(--primary);color:#fff;
    padding:16px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;box-shadow:0 2px 6px rgba(103,80,164,.35)}
  /* Модалка выбора месяца */
  .ovl{position:fixed;inset:0;background:rgba(29,27,32,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
  .ovl.on{display:flex}
  .dlg{width:100%;max-width:380px;background:var(--surf);border-radius:28px;padding:22px 20px}
  .dlg h2{margin:0 0 4px;font-size:16px;font-weight:500;color:var(--dim)}
  .ynav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 16px}
  .ynav b{font-size:22px;font-weight:500}
  .ynav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--surf2);color:var(--onPrimCont);font-size:20px;cursor:pointer}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mgrid button{border:0;border-radius:999px;background:transparent;padding:14px 2px;font-size:14px;
    color:var(--ink);font-family:inherit;cursor:pointer}
  .mgrid button:hover{background:var(--surf3)}
  .mgrid button.cur{background:var(--primary);color:#fff;font-weight:600}
  .acts{display:flex;justify-content:flex-end;margin-top:14px}
  .acts button{border:0;background:none;color:var(--primary);font-size:14px;font-weight:500;padding:12px 18px;border-radius:999px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <button class="head" id="head" aria-haspopup="dialog">
    <span><span class="m" id="hMonth"></span><span class="y" id="hYear" style="display:block"></span></span>
    <span class="ic">▾</span>
  </button>
  <div class="board">
    <div class="wd" id="wd"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="chips">
    <span class="chip filled" id="chipTotal"></span>
    <span class="chip" id="chipDays"></span>
  </div>
  <button class="fab" id="tbtn">Сегодня</button>
</div>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="dlg">
    <h2>Перейти к месяцу</h2>
    <div class="ynav">
      <button id="prevY" aria-label="Предыдущий год">‹</button>
      <b id="yLbl"></b>
      <button id="nextY" aria-label="Следующий год">›</button>
    </div>
    <div class="mgrid" id="mgrid"></div>
    <div class="acts"><button id="cancel">Отмена</button></div>
  </div>
</div>

<script>
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MSHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const today=new Date();
  let vy=today.getFullYear(), vm=today.getMonth(), pickY=vy;

  function rnd(y,m,d){const x=Math.sin((y*12+m)*23.1+d*9.31)*10000;return x-Math.floor(x);}
  function tasks(y,m,d){const r=rnd(y,m,d);return r<.45?0:1+Math.floor(r*10)%3;}

  document.getElementById('wd').innerHTML=WD.map(d=>'<div>'+d+'</div>').join('');

  function draw(){
    document.getElementById('hMonth').textContent=MONTHS[vm];
    document.getElementById('hYear').textContent=vy+' год';
    const off=(new Date(vy,vm,1).getDay()+6)%7;
    const dim=new Date(vy,vm+1,0).getDate(), pdim=new Date(vy,vm,0).getDate();
    let html='',total=0,days=0;
    for(let i=off-1;i>=0;i--) html+='<div class="cell out">'+(pdim-i)+'</div>';
    for(let d=1;d<=dim;d++){
      const t=tasks(vy,vm,d); total+=t; if(t)days++;
      const isT=(d===today.getDate()&&vm===today.getMonth()&&vy===today.getFullYear());
      html+='<div class="cell'+(isT?' today':(t?' has':''))+'">'+d+
            '<div class="pills">'+'<i></i>'.repeat(t)+'</div></div>';
    }
    const rest=(7-((off+dim)%7))%7;
    for(let d=1;d<=rest;d++) html+='<div class="cell out">'+d+'</div>';
    document.getElementById('grid').innerHTML=html;
    document.getElementById('chipTotal').textContent='Задач: '+total;
    document.getElementById('chipDays').textContent='Занятых дней: '+days;
  }

  function drawMonths(){
    document.getElementById('yLbl').textContent=pickY;
    document.getElementById('mgrid').innerHTML=MSHORT.map((m,i)=>
      '<button data-m="'+i+'" class="'+(i===vm&&pickY===vy?'cur':'')+'">'+m+'</button>').join('');
  }

  const ovl=document.getElementById('ovl');
  const open=()=>{pickY=vy;drawMonths();ovl.classList.add('on');};
  const close=()=>ovl.classList.remove('on');

  document.getElementById('head').addEventListener('click',open);
  document.getElementById('cancel').addEventListener('click',close);
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
  document.getElementById('prevY').addEventListener('click',()=>{pickY--;drawMonths();});
  document.getElementById('nextY').addEventListener('click',()=>{pickY++;drawMonths();});
  document.getElementById('mgrid').addEventListener('click',e=>{
    const b=e.target.closest('button[data-m]');if(!b)return;
    vm=+b.dataset.m;vy=pickY;draw();close();
  });
  document.getElementById('tbtn').addEventListener('click',()=>{vy=today.getFullYear();vm=today.getMonth();draw();});

  draw();
</script>
</body>
</html>
