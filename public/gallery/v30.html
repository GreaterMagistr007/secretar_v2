<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30. Королевский / тёмно-синий с золотом</title>
<style>
  /* Вариант 30 — «королевский»: тёмно-синий с золотом, вензельные разделители, засечки в заголовке */
  :root{
    --bg:#0b1530; --bg2:#122043; --panel:#16274f; --gold:#d5b168; --gold2:#f0dca8;
    --ink:#eef2fb; --dim:#8a9bc4; --line:#2a3d6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden;min-height:100vh;
    font-family:Georgia,"Times New Roman",serif;
    background-image:radial-gradient(90% 45% at 50% 0%,#16274f 0%,var(--bg) 70%)}
  .wrap{max-width:430px;margin:0 auto;padding:22px 16px 40px}
  /* Рамка в золоте */
  .frame{border:1px solid var(--gold);border-radius:4px;padding:2px}
  .frame-in{border:1px solid rgba(213,177,104,.35);border-radius:2px;padding:18px 14px 20px;background:linear-gradient(180deg,rgba(22,39,79,.6),rgba(11,21,48,.3))}
  /* Вензельный разделитель */
  .orn{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:13px;letter-spacing:.3em}
  .orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .head{width:100%;background:none;border:0;padding:0;cursor:pointer;color:inherit;font-family:inherit;display:block;text-align:center}
  .head .m{font-size:38px;font-weight:400;letter-spacing:.02em;color:var(--gold2);line-height:1.12;
    text-shadow:0 2px 10px rgba(213,177,104,.28)}
  .head .y{font-size:14px;letter-spacing:.44em;color:var(--gold);margin-top:8px}
  .head .sub{font-size:11px;color:var(--dim);font-style:italic;margin-top:10px;letter-spacing:.04em}
  .wd{display:grid;grid-template-columns:repeat(7,1fr);margin:16px 0 8px}
  .wd div{text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);opacity:.8}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{aspect-ratio:1/1.08;border:1px solid var(--line);border-radius:3px;background:rgba(18,32,67,.75);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;color:var(--ink)}
  .cell.out{border-color:transparent;background:none;color:#3c4c76}
  .cell.has{border-color:rgba(213,177,104,.4)}
  .cell.today{background:linear-gradient(180deg,#25386c,#1a2b57);border:1px solid var(--gold);
    color:var(--gold2);font-weight:700;box-shadow:0 0 12px rgba(213,177,104,.3)}
  .marks{display:flex;gap:3px;height:6px;color:var(--gold);font-size:8px;line-height:6px;letter-spacing:1px}
  .cell.today .marks{color:var(--gold2)}
  .plate{margin-top:18px;border-top:1px solid rgba(213,177,104,.3);border-bottom:1px solid rgba(213,177,104,.3);
    padding:12px 4px;display:flex;justify-content:space-around;text-align:center}
  .plate .v{font-size:20px;color:var(--gold2)}
  .plate .k{font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
  .tbtn{margin-top:18px;width:100%;background:linear-gradient(180deg,#d5b168,#b8923f);color:#1a1405;border:0;
    border-radius:3px;padding:14px;font-family:inherit;font-size:15px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  /* Модалка */
  .ovl{position:fixed;inset:0;background:rgba(4,9,22,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  .ovl.on{display:flex}
  .dlg{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--gold);border-radius:4px;padding:6px}
  .dlg-in{border:1px solid rgba(213,177,104,.3);padding:16px 14px}
  .dlg h2{margin:0 0 12px;text-align:center;font-size:12px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);font-weight:400}
  .ynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ynav b{font-size:24px;font-weight:400;color:var(--gold2);letter-spacing:.14em}
  .ynav button{width:40px;height:40px;border:1px solid rgba(213,177,104,.45);background:none;color:var(--gold);
    font-size:19px;border-radius:2px;cursor:pointer;font-family:inherit}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .mgrid button{border:1px solid var(--line);background:rgba(11,21,48,.6);color:var(--ink);padding:13px 2px;
    font-size:13px;border-radius:2px;cursor:pointer;font-family:inherit}
  .mgrid button.cur{border-color:var(--gold);color:var(--gold2);background:linear-gradient(180deg,#25386c,#1a2b57)}
  .cancel{margin-top:14px;width:100%;border:1px solid var(--line);background:none;color:var(--dim);
    padding:12px;font-family:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame"><div class="frame-in">
    <div class="orn">❧</div>
    <button class="head" id="head" aria-haspopup="dialog" style="margin-top:14px">
      <div class="m" id="hMonth"></div>
      <div class="y" id="hYear"></div>
      <div class="sub">— нажмите, чтобы сменить месяц —</div>
    </button>
    <div class="orn" style="margin-top:14px">✦</div>
    <div class="wd" id="wd"></div>
    <div class="grid" id="grid"></div>
    <div class="plate">
      <div><div class="v" id="s1"></div><div class="k">дел</div></div>
      <div><div class="v" id="s2"></div><div class="k">дней занято</div></div>
      <div><div class="v" id="s3"></div><div class="k">свободно</div></div>
    </div>
    <button class="tbtn" id="tbtn">Сегодня</button>
  </div></div>
</div>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="dlg"><div class="dlg-in">
    <h2>Выбор месяца</h2>
    <div class="ynav">
      <button id="prevY" aria-label="Предыдущий год">‹</button>
      <b id="yLbl"></b>
      <button id="nextY" aria-label="Следующий год">›</button>
    </div>
    <div class="mgrid" id="mgrid"></div>
    <button class="cancel" id="cancel">Отмена</button>
  </div></div>
</div>

<script>
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MSHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const today=new Date();
  let vy=today.getFullYear(), vm=today.getMonth(), pickY=vy;

  function rnd(y,m,d){const x=Math.sin((y*12+m)*33.1+d*2.97)*10000;return x-Math.floor(x);}
  function tasks(y,m,d){const r=rnd(y,m,d);return r<.47?0:1+Math.floor(r*10)%3;}

  document.getElementById('wd').innerHTML=WD.map(d=>'<div>'+d+'</div>').join('');

  function draw(){
    document.getElementById('hMonth').textContent=MONTHS[vm];
    document.getElementById('hYear').textContent=vy;
    const off=(new Date(vy,vm,1).getDay()+6)%7;
    const dim=new Date(vy,vm+1,0).getDate(), pdim=new Date(vy,vm,0).getDate();
    let html='',total=0,busy=0;
    for(let i=off-1;i>=0;i--) html+='<div class="cell out">'+(pdim-i)+'<div class="marks"></div></div>';
    for(let d=1;d<=dim;d++){
      const t=tasks(vy,vm,d); total+=t; if(t)busy++;
      const isT=(d===today.getDate()&&vm===today.getMonth()&&vy===today.getFullYear());
      html+='<div class="cell'+(isT?' today':(t?' has':''))+'">'+d+
            '<div class="marks">'+'◆'.repeat(t)+'</div></div>';
    }
    const rest=(7-((off+dim)%7))%7;
    for(let d=1;d<=rest;d++) html+='<div class="cell out">'+d+'<div class="marks"></div></div>';
    document.getElementById('grid').innerHTML=html;
    document.getElementById('s1').textContent=total;
    document.getElementById('s2').textContent=busy;
    document.getElementById('s3').textContent=dim-busy;
  }

  function drawMonths(){
    document.getElementById('yLbl').textContent=pickY;
    document.getElementById('mgrid').innerHTML=MSHORT.map((m,i)=>
      '<button data-m="'+i+'" class="'+(i===vm&&pickY===vy?'cur':'')+'">'+m+'</button>').join('');
  }

  const ovl=document.getElementById('ovl');
  const open=()=>{pickY=vy;drawMonths();ovl.classList.add('on');};
  const close=()=>ovl.classList.remove('on');

  document.getElementById('head').addEventListener('click',open);
  document.getElementById('cancel').addEventListener('click',close);
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
  document.getElementById('prevY').addEventListener('click',()=>{pickY--;drawMonths();});
  document.getElementById('nextY').addEventListener('click',()=>{pickY++;drawMonths();});
  document.getElementById('mgrid').addEventListener('click',e=>{
    const b=e.target.closest('button[data-m]');if(!b)return;
    vm=+b.dataset.m;vy=pickY;draw();close();
  });
  document.getElementById('tbtn').addEventListener('click',()=>{vy=today.getFullYear();vm=today.getMonth();draw();});

  draw();
</script>
</body>
</html>
