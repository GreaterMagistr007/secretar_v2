<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>19. Терракота / недели-карточки</title>
<style>
  :root{
    --bg:#fbf4ee; --card:#fff;--ink:#3a2018; --muted:#a1796a;
    --terra:#c0562f; --terra-d:#8c3a1c; --terra-l:#f6e0d4; --line:#efdccf;
    --olive:#7e8a4b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .phone{max-width:420px;margin:0 auto;min-height:100vh;padding:0 14px 30px}

  .hdr{padding:22px 2px 8px;display:flex;align-items:flex-end;gap:10px}
  .month-btn{
    background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;flex:1;
  }
  .month-btn .m{
    display:block;font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.05;color:var(--terra-d);
  }
  .month-btn .y{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
  .month-btn .m::after{content:" ▾";font-size:15px;color:var(--terra)}
  .today-btn{
    border:1.5px solid var(--terra);background:transparent;color:var(--terra-d);border-radius:999px;
    padding:8px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  }

  .weeks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  /* каждая неделя — отдельная карточка-строка */
  .week{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 12px;
    box-shadow:0 6px 16px rgba(140,58,28,.06);
  }
  .week.current{border-color:var(--terra);box-shadow:0 8px 22px rgba(192,86,47,.16)}
  .week .wh{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 4px 8px;margin-bottom:6px;border-bottom:1px dashed var(--line);
  }
  .week .wh b{font-size:12px;font-weight:800;color:var(--terra-d);letter-spacing:.2px}
  .week .wh span{font-size:11px;color:var(--muted);font-weight:600}
  .week.current .wh b::before{content:"● ";color:var(--terra);font-size:9px;vertical-align:middle}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .day{
    border:0;background:transparent;border-radius:12px;padding:5px 0 6px;cursor:pointer;font:inherit;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .day .wd{font-size:8px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .day .n{font-size:15px;font-weight:700;line-height:1}
  .day.out .n,.day.out .wd{color:#d8c0b4}
  .day.today{background:var(--terra);color:#fff}
  .day.today .wd{color:#f7d6c8}
  .day.sel{background:var(--terra-l)}
  .day.sel.today{background:var(--terra-d)}
  .pips{display:flex;gap:2px;height:5px}
  .pips i{width:5px;height:5px;border-radius:1.5px;background:var(--terra);display:block;transform:rotate(45deg)}
  .pips i.o{background:var(--olive)}
  .day.today .pips i{background:#ffd9c8}
  .day.out .pips i{background:#e3cdc1}

  .note{
    margin-top:16px;background:var(--terra-l);border-radius:18px;padding:14px 16px;
  }
  .note b{display:block;font-size:14px;font-weight:800;color:var(--terra-d)}
  .note span{display:block;font-size:12px;color:#7a4e3c;margin-top:4px;line-height:1.5}

  .overlay{position:fixed;inset:0;background:rgba(58,32,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:420px;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px 26px}
  .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
  .year{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .year b{font-size:20px;font-weight:800;color:var(--terra-d)}
  .nav{width:40px;height:40px;border-radius:13px;border:1.5px solid var(--line);background:#fff;color:var(--terra-d);font-size:18px;cursor:pointer}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .months button{
    padding:13px 2px;border-radius:14px;border:1.5px solid var(--line);background:#fffaf7;font:inherit;
    font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .months button.cur{background:var(--terra);border-color:var(--terra);color:#fff}
  .months button.now{border-color:var(--terra);color:var(--terra-d)}
  .cancel{width:100%;margin-top:14px;padding:13px;border-radius:15px;border:0;background:var(--terra-l);color:var(--terra-d);font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <header class="hdr">
    <button class="month-btn" id="monthBtn" aria-haspopup="dialog">
      <span class="m" id="mName">—</span>
      <span class="y" id="mYear"></span>
    </button>
    <button class="today-btn" id="todayBtn">Сегодня</button>
  </header>

  <div class="weeks" id="weeks"></div>

  <div class="note">
    <b id="noteTitle">—</b>
    <span id="noteText"></span>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="sheet">
    <div class="grab"></div>
    <div class="year">
      <button class="nav" id="prevYear" aria-label="Предыдущий год">‹</button>
      <b id="pickYear">2026</b>
      <button class="nav" id="nextYear" aria-label="Следующий год">›</button>
    </div>
    <div class="months" id="months"></div>
    <button class="cancel" id="cancelBtn">Отмена</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var SHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  var GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var SGEN=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

  function hash(y,m,d,salt){
    var x=((y*12+m)*32+d)*43+(salt||0);
    x=(x*2654435761)%4294967296; x=x^(x>>>5);
    return Math.abs(x)%100003;
  }
  function count(y,m,d){ var h=hash(y,m,d,3); return (h%100<41)?0:1+(h%4); }
  function isHome(y,m,d){ return hash(y,m,d,13)%5===0; }

  var today=new Date();
  var todayKey=today.getFullYear()+"-"+today.getMonth()+"-"+today.getDate();
  var viewY=today.getFullYear(), viewM=today.getMonth();
  var selY=viewY, selM=viewM, selD=today.getDate(), pickYear=viewY;

  var $=function(id){return document.getElementById(id);};
  var weeksEl=$("weeks"), overlay=$("overlay");

  function render(){
    $("mName").textContent=MONTHS[viewM];
    $("mYear").textContent=viewY+" год";

    var offset=(new Date(viewY,viewM,1).getDay()+6)%7;
    var start=new Date(viewY,viewM,1-offset);
    var days=new Date(viewY,viewM+1,0).getDate();
    var rows=Math.ceil((offset+days)/7);

    weeksEl.innerHTML="";
    for(var r=0;r<rows;r++){
      var first=new Date(start.getFullYear(),start.getMonth(),start.getDate()+r*7);
      var last=new Date(first.getFullYear(),first.getMonth(),first.getDate()+6);
      var card=document.createElement("div");
      var isCur=(today>=first && today<=new Date(last.getFullYear(),last.getMonth(),last.getDate(),23,59,59));
      card.className="week"+(isCur?" current":"");

      var range=first.getDate()+" "+SGEN[first.getMonth()]+" — "+last.getDate()+" "+SGEN[last.getMonth()];
      var total=0, html="";
      for(var c=0;c<7;c++){
        var d=new Date(first.getFullYear(),first.getMonth(),first.getDate()+c);
        var y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
        var key=y+"-"+m+"-"+n, cnt=count(y,m,n);
        if(m===viewM) total+=cnt;
        var pips="", home=isHome(y,m,n);
        for(var k=0;k<Math.min(cnt,3);k++) pips+='<i class="'+(home&&k===0?"o":"")+'"></i>';
        html+='<button type="button" class="day'+(m!==viewM?" out":"")
          +(key===todayKey?" today":"")+(y===selY&&m===selM&&n===selD?" sel":"")
          +'" data-y="'+y+'" data-m="'+m+'" data-d="'+n+'">'
          +'<span class="wd">'+WD[c]+'</span><span class="n">'+n+'</span>'
          +'<span class="pips">'+pips+'</span></button>';
      }
      card.innerHTML='<div class="wh"><b>'+(isCur?"Текущая неделя":"Неделя "+(r+1))+'</b>'
        +'<span>'+range+' · '+total+' задач</span></div>'
        +'<div class="days">'+html+'</div>';
      weeksEl.appendChild(card);
    }
    updateNote();
  }

  function updateNote(){
    var c=count(selY,selM,selD);
    $("noteTitle").textContent=selD+" "+GEN[selM]+" · "+c+" задач(и)";
    $("noteText").textContent=c
      ? (isHome(selY,selM,selD)?"Среди них есть домашние дела — отмечены оливковым.":"Все задачи рабочие.")
      : "День пока свободен — можно запланировать что-то заранее.";
  }

  weeksEl.addEventListener("click",function(e){
    var b=e.target.closest(".day");
    if(!b) return;
    selY=+b.dataset.y; selM=+b.dataset.m; selD=+b.dataset.d;
    if(selM!==viewM||selY!==viewY){ viewY=selY; viewM=selM; }
    render();
  });

  $("todayBtn").addEventListener("click",function(){
    viewY=today.getFullYear(); viewM=today.getMonth();
    selY=viewY; selM=viewM; selD=today.getDate(); render();
  });

  function renderMonths(){
    $("pickYear").textContent=pickYear;
    var h="";
    for(var i=0;i<12;i++){
      var cls="";
      if(pickYear===viewY&&i===viewM) cls="cur";
      else if(pickYear===today.getFullYear()&&i===today.getMonth()) cls="now";
      h+='<button type="button" class="'+cls+'" data-m="'+i+'">'+SHORT[i]+'</button>';
    }
    $("months").innerHTML=h;
  }
  function open(){ pickYear=viewY; renderMonths(); overlay.classList.add("open"); }
  function close(){ overlay.classList.remove("open"); }

  $("monthBtn").addEventListener("click",open);
  $("prevYear").addEventListener("click",function(){pickYear--;renderMonths();});
  $("nextYear").addEventListener("click",function(){pickYear++;renderMonths();});
  $("cancelBtn").addEventListener("click",close);
  $("months").addEventListener("click",function(e){
    var b=e.target.closest("button[data-m]");
    if(!b) return;
    viewY=pickYear; viewM=+b.dataset.m; selY=viewY; selM=viewM;
    selD=(viewY===today.getFullYear()&&viewM===today.getMonth())?today.getDate():1;
    close(); render();
  });
  overlay.addEventListener("click",function(e){ if(e.target===overlay) close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });

  render();
})();
</script>
</body>
</html>
