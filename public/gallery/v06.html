<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>06. Коралловый риф / месяц-таблетка</title>
<style>
  /* Вариант 06: коралловая палитра, заголовок-«таблетка» на цветной подложке, крупные ячейки */
  :root{
    --bg:#fff6f3;
    --wash:#ff6f5e;
    --surface:#ffffff;
    --line:#ffe0d8;
    --text:#3d2320;
    --muted:#b9887f;
    --accent:#ff6f5e;
    --accent-soft:#ffe4de;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  .screen{max-width:430px;min-width:320px;margin:0 auto;min-height:100vh;padding-bottom:28px;}

  .wash{
    background:linear-gradient(180deg,var(--wash),#ff8a72);
    padding:calc(16px + env(safe-area-inset-top)) 16px 34px;
    border-radius:0 0 28px 28px;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .round{
    width:38px;height:38px;flex:0 0 38px;border-radius:50%;
    border:0;background:rgba(255,255,255,.25);color:#fff;cursor:pointer;font-size:17px;line-height:1;
  }
  .pill{
    flex:1;min-width:0;border:0;cursor:pointer;font-family:inherit;
    background:#fff;color:var(--accent);
    border-radius:999px;padding:12px 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 16px rgba(214,80,63,.28);
  }
  .pill-text{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill-caret{font-size:11px;opacity:.7;}

  .today-row{display:flex;justify-content:center;margin-top:-16px;}
  .today-btn{
    border:0;border-radius:999px;background:var(--surface);color:var(--accent);
    font:inherit;font-size:13px;font-weight:700;padding:8px 20px;cursor:pointer;
    box-shadow:0 3px 10px rgba(214,80,63,.18);
  }

  .grid-box{margin:16px 10px 0;}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);}
  .weekdays span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:8px;}
  .weekdays span.we{color:var(--accent);}
  .days{gap:5px;}
  .cell{
    aspect-ratio:1/1.18;background:var(--surface);border-radius:16px;
    border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    font-size:19px;font-weight:600;
  }
  .cell.out{background:transparent;border-color:transparent;color:#e3c3bc;font-weight:400;}
  .cell.we:not(.out){color:var(--accent);}
  .cell.today{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(255,111,94,.35);}
  .marks{display:flex;gap:4px;height:7px;align-items:center;}
  .mark{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .cell.today .mark{background:#fff;}
  .count{font-size:11px;font-weight:700;color:var(--muted);line-height:1;}
  .cell.today .count{color:rgba(255,255,255,.9);}

  .tip{margin:18px 20px 0;font-size:13px;color:var(--muted);text-align:center;}

  /* Модалка */
  .overlay{position:fixed;inset:0;background:rgba(61,35,32,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20;}
  .overlay.open{display:flex;}
  .dialog{width:100%;max-width:370px;background:var(--surface);border-radius:26px;padding:18px;box-shadow:0 20px 46px rgba(61,35,32,.3);}
  .d-title{text-align:center;font-size:16px;font-weight:700;color:var(--accent);margin-bottom:14px;}
  .y-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;}
  .y-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);cursor:pointer;font-size:16px;}
  .y-val{font-size:20px;font-weight:700;min-width:62px;text-align:center;}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .pick{padding:14px 2px;border-radius:16px;border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .pick.now{outline:2px solid var(--accent);outline-offset:-2px;}
  .pick.active{background:var(--accent);color:#fff;}
  .ghost{width:100%;margin-top:16px;padding:13px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="screen">
  <div class="wash">
    <button class="round" id="prev" type="button" aria-label="Предыдущий месяц">&#8249;</button>
    <button class="pill" id="titleBtn" type="button">
      <span class="pill-text" id="titleMonth">—</span>
      <span class="pill-caret">&#9660;</span>
    </button>
    <button class="round" id="next" type="button" aria-label="Следующий месяц">&#8250;</button>
  </div>

  <div class="today-row"><button class="today-btn" id="todayBtn" type="button">Сегодня</button></div>

  <div class="grid-box">
    <div class="weekdays" id="weekdays"></div>
    <div class="days" id="days"></div>
  </div>

  <div class="tip">Кружки под числом — задачи, цифра рядом появляется, когда их больше трёх.</div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
    <div class="d-title">Перейти к месяцу</div>
    <div class="y-row">
      <button class="y-btn" id="yearPrev" type="button" aria-label="Предыдущий год">&#8249;</button>
      <span class="y-val" id="yearVal">—</span>
      <button class="y-btn" id="yearNext" type="button" aria-label="Следующий год">&#8250;</button>
    </div>
    <div class="months" id="months"></div>
    <button class="ghost" id="cancelBtn" type="button">Отмена</button>
  </div>
</div>

<script>
(function(){
  var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var SHORT  = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  var WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  var today = new Date();
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var pickerYear = view.y;

  // Детерминированные демо-задачи
  function tasksFor(y, m, d){
    var h = Math.abs((y * 61 + (m + 1) * 197 + d * 3571) * 16807 % 100);
    if (h < 47) return 0;
    if (h < 71) return 1;
    if (h < 88) return 2;
    if (h < 96) return 3;
    return 6;
  }

  function buildCells(y, m){
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var cells = [], i, d;
    // Дни соседних месяцев скрыты: в начале месяца просто пустые ячейки
    for (i = 0; i < offset; i++) cells.push({ d: 0, out: true });
    for (d = 1; d <= dim; d++) cells.push({ d: d, out: false });
    while (cells.length % 7 !== 0) cells.push({ d: 0, out: true });
    return cells;
  }

  var daysEl = document.getElementById('days');
  var wdEl = document.getElementById('weekdays');

  WD.forEach(function(w, i){
    var s = document.createElement('span');
    s.textContent = w;
    if (i > 4) s.className = 'we';
    wdEl.appendChild(s);
  });

  function render(){
    document.getElementById('titleMonth').textContent = MONTHS[view.m] + ' ' + view.y;
    daysEl.innerHTML = '';
    buildCells(view.y, view.m).forEach(function(c, idx){
      var el = document.createElement('div');
      var cls = 'cell';
      if (c.out) cls += ' out';
      if (idx % 7 > 4) cls += ' we';
      var isToday = !c.out && c.d === today.getDate() && view.m === today.getMonth() && view.y === today.getFullYear();
      if (isToday) cls += ' today';
      el.className = cls;

      if (c.out) { daysEl.appendChild(el); return; }

      var num = document.createElement('span');
      num.textContent = c.d;
      el.appendChild(num);

      var n = tasksFor(view.y, view.m, c.d);
      if (n > 3) {
        var cnt = document.createElement('span');
        cnt.className = 'count';
        cnt.textContent = n + ' задачи';
        el.appendChild(cnt);
      } else {
        var marks = document.createElement('div');
        marks.className = 'marks';
        for (var k = 0; k < n; k++) {
          var mk = document.createElement('i');
          mk.className = 'mark';
          marks.appendChild(mk);
        }
        el.appendChild(marks);
      }
      daysEl.appendChild(el);
    });
  }

  function shift(delta){
    var m = view.m + delta;
    view.y += Math.floor(m / 12);
    view.m = ((m % 12) + 12) % 12;
    render();
  }

  document.getElementById('prev').addEventListener('click', function(){ shift(-1); });
  document.getElementById('next').addEventListener('click', function(){ shift(1); });
  document.getElementById('todayBtn').addEventListener('click', function(){
    view.y = today.getFullYear(); view.m = today.getMonth(); render();
  });

  /* Модалка выбора месяца */
  var overlay = document.getElementById('overlay');
  var monthsEl = document.getElementById('months');

  function renderPicker(){
    document.getElementById('yearVal').textContent = pickerYear;
    monthsEl.innerHTML = '';
    MONTHS.forEach(function(name, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = SHORT[i];
      var cls = 'pick';
      if (i === today.getMonth() && pickerYear === today.getFullYear()) cls += ' now';
      if (i === view.m && pickerYear === view.y) cls += ' active';
      b.className = cls;
      b.addEventListener('click', function(){
        view.y = pickerYear; view.m = i; closeModal(); render();
      });
      monthsEl.appendChild(b);
    });
  }

  function openModal(){ pickerYear = view.y; renderPicker(); overlay.classList.add('open'); }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('titleBtn').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('yearPrev').addEventListener('click', function(){ pickerYear--; renderPicker(); });
  document.getElementById('yearNext').addEventListener('click', function(){ pickerYear++; renderPicker(); });
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
