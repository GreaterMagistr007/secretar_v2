<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21. Полночь / крупный тонкий месяц</title>
<style>
  /* Вариант 21 — глубокая тёмная тема «полночь», тонкая крупная типографика */
  :root{
    --bg:#070b18; --bg2:#0d1428; --line:#1b2542; --ink:#e8ecf8;
    --dim:#5a678c; --accent:#6f8dff; --accent2:#3a4d94; --today:#9db2ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 60% at 50% 0%, #101a36 0%, var(--bg) 60%);
    color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;overflow-x:hidden;
  }
  .wrap{max-width:430px;margin:0 auto;padding:34px 20px 40px}
  /* Шапка с месяцем — ключевой элемент */
  .head{border:0;background:none;color:inherit;display:block;width:100%;text-align:left;padding:0;cursor:pointer}
  .head .year{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--dim)}
  .head .month{font-size:46px;line-height:1.05;font-weight:200;letter-spacing:-.02em;margin-top:10px}
  .head .hint{margin-top:12px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .head .hint span.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .rule{height:1px;background:linear-gradient(90deg,var(--accent2),transparent);margin:22px 0 18px}
  .wd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px}
  .wd div{text-align:center;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cell{aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
        border-radius:12px;font-size:16px;font-weight:300;color:var(--ink);position:relative}
  .cell.out{color:#2c3559}
  .cell.today{background:linear-gradient(180deg,#1d2a52,#141d3a);box-shadow:inset 0 0 0 1px var(--accent2);color:var(--today);font-weight:500}
  .dots{display:flex;gap:3px;height:5px}
  .dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.85}
  .cell.out .dots i{background:#2c3559}
  .legend{margin-top:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
  .todaybtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 18px;font-size:13px;cursor:pointer}
  /* Модалка выбора месяца */
  .ovl{position:fixed;inset:0;background:rgba(3,6,16,.78);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .ovl.on{display:flex}
  .sheet{width:100%;max-width:430px;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .ynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .ynav b{font-size:24px;font-weight:300;letter-spacing:.06em}
  .ynav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:17px;cursor:pointer}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mgrid button{padding:14px 4px;border-radius:12px;border:1px solid transparent;background:#121a33;color:var(--ink);font-size:14px;font-weight:300;cursor:pointer}
  .mgrid button.cur{border-color:var(--accent);color:var(--today)}
  .cancel{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--dim);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <button class="head" id="head" aria-haspopup="dialog">
    <div class="year" id="hYear"></div>
    <div class="month" id="hMonth"></div>
    <div class="hint"><span class="dot"></span>нажмите, чтобы выбрать месяц</div>
  </button>
  <div class="rule"></div>
  <div class="wd" id="wd"></div>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span id="cnt"></span>
    <button class="todaybtn" id="tbtn">Сегодня</button>
  </div>
</div>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="sheet" id="sheet">
    <div class="ynav">
      <button id="prevY" aria-label="Предыдущий год">‹</button>
      <b id="yLbl"></b>
      <button id="nextY" aria-label="Следующий год">›</button>
    </div>
    <div class="mgrid" id="mgrid"></div>
    <button class="cancel" id="cancel">Отмена</button>
  </div>
</div>

<script>
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const today=new Date();
  let vy=today.getFullYear(), vm=today.getMonth(), pickY=vy;

  // Демонстрационные задачи: детерминированный «шум» по дате
  function rnd(y,m,d){const x=Math.sin((y*12+m)*31.7+d*7.13)*10000;return x-Math.floor(x);}
  function tasks(y,m,d){const r=rnd(y,m,d);return r<.5?0:1+Math.floor(r*10)%3;}

  document.getElementById('wd').innerHTML=WD.map(d=>'<div>'+d+'</div>').join('');

  function draw(){
    document.getElementById('hMonth').textContent=MONTHS[vm];
    document.getElementById('hYear').textContent=vy;
    const first=new Date(vy,vm,1), off=(first.getDay()+6)%7;
    const dim=new Date(vy,vm+1,0).getDate(), pdim=new Date(vy,vm,0).getDate();
    let html='',total=0;
    for(let i=off-1;i>=0;i--) html+='<div class="cell out">'+(pdim-i)+'<div class="dots"></div></div>';
    for(let d=1;d<=dim;d++){
      const t=tasks(vy,vm,d);total+=t;
      const isT=(d===today.getDate()&&vm===today.getMonth()&&vy===today.getFullYear());
      html+='<div class="cell'+(isT?' today':'')+'">'+d+'<div class="dots">'+'<i></i>'.repeat(t)+'</div></div>';
    }
    const rest=(7-((off+dim)%7))%7;
    for(let d=1;d<=rest;d++) html+='<div class="cell out">'+d+'<div class="dots"></div></div>';
    document.getElementById('grid').innerHTML=html;
    document.getElementById('cnt').textContent='Задач в месяце: '+total;
  }

  function drawMonths(){
    document.getElementById('yLbl').textContent=pickY;
    document.getElementById('mgrid').innerHTML=MONTHS.map((m,i)=>
      '<button data-m="'+i+'" class="'+(i===vm&&pickY===vy?'cur':'')+'">'+m.slice(0,3)+'</button>').join('');
  }

  const ovl=document.getElementById('ovl');
  function open(){pickY=vy;drawMonths();ovl.classList.add('on');}
  function close(){ovl.classList.remove('on');}

  document.getElementById('head').addEventListener('click',open);
  document.getElementById('cancel').addEventListener('click',close);
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
  document.getElementById('prevY').addEventListener('click',()=>{pickY--;drawMonths();});
  document.getElementById('nextY').addEventListener('click',()=>{pickY++;drawMonths();});
  document.getElementById('mgrid').addEventListener('click',e=>{
    const b=e.target.closest('button[data-m]');if(!b)return;
    vm=+b.dataset.m;vy=pickY;draw();close();
  });
  document.getElementById('tbtn').addEventListener('click',()=>{vy=today.getFullYear();vm=today.getMonth();draw();});

  draw();
</script>
</body>
</html>
