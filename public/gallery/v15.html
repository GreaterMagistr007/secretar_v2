<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>15. Океан / квадраты-заливка по загруженности</title>
<style>
  :root{
    --bg:#eef6f7; --ink:#04262e; --muted:#5f8791; --line:#d8e9eb;
    --l0:#e7f1f2; --l1:#bfe0de; --l2:#7ec6c3; --l3:#39a3a6; --l4:#0f7a86; --l5:#08505e;
    --deep:#063a45;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .phone{max-width:420px;margin:0 auto;min-height:100vh;padding:0 14px 28px}

  .hdr{
    display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
    padding:24px 4px 16px;
  }
  .month-btn{
    background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;
  }
  .month-btn .m{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
  .month-btn .y{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:3px}
  .month-btn .m::after{content:" ▾";font-size:14px;color:var(--l3);font-weight:700}
  .today-btn{
    border:0;background:var(--deep);color:#dff0f1;border-radius:11px;padding:9px 14px;
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  }

  .wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
  .wd span{text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.5px}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{
    aspect-ratio:1;border:0;border-radius:9px;background:var(--l0);cursor:pointer;
    font:inherit;color:var(--ink);position:relative;padding:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s;
  }
  .cell:active{transform:scale(.94)}
  .cell .n{font-size:14px;font-weight:700}
  .cell.lv1{background:var(--l1)}
  .cell.lv2{background:var(--l2)}
  .cell.lv3{background:var(--l3);color:#eaf7f7}
  .cell.lv4{background:var(--l4);color:#eaf7f7}
  .cell.lv5{background:var(--l5);color:#eaf7f7}
  .cell.out{background:transparent;color:#b3ccd0}
  .cell.out .n{font-weight:500}
  .cell.today{box-shadow:inset 0 0 0 2.5px var(--deep)}
  .cell.sel::after{
    content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
    width:12px;height:2px;border-radius:2px;background:currentColor;opacity:.85;
  }

  .scale{display:flex;align-items:center;gap:6px;margin:16px 4px 0;font-size:11px;color:var(--muted);font-weight:600}
  .scale i{width:16px;height:16px;border-radius:5px;display:block}
  .scale .sp{flex:1}

  .panel{
    margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  }
  .panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel .d{font-size:15px;font-weight:700}
  .panel .load{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--l1);color:var(--deep)}
  .panel .bar{display:flex;gap:3px;margin-top:12px}
  .panel .bar i{flex:1;height:6px;border-radius:3px;background:var(--l0)}
  .panel .bar i.on{background:var(--l3)}
  .panel p{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.5}

  .overlay{position:fixed;inset:0;background:rgba(4,38,46,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:16px 14px 26px}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
  .year{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}
  .year b{font-size:19px;font-weight:800}
  .nav{width:36px;height:36px;border-radius:10px;border:0;background:var(--l0);color:var(--deep);font-size:17px;cursor:pointer}
  .months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .months button{
    padding:14px 2px;border-radius:10px;border:0;background:var(--l0);font:inherit;font-size:12px;
    font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  }
  .months button u{display:block;width:22px;height:4px;border-radius:3px;text-decoration:none}
  .months button.cur{background:var(--l4);color:#fff}
  .months button.now{box-shadow:inset 0 0 0 2px var(--l3)}
  .cancel{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:0;background:var(--l1);color:var(--deep);font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <header class="hdr">
    <button class="month-btn" id="monthBtn" aria-haspopup="dialog">
      <span class="m" id="mName">—</span>
      <span class="y" id="mYear"></span>
    </button>
    <button class="today-btn" id="todayBtn">Сегодня</button>
  </header>

  <div class="wd" id="wd"></div>
  <div class="grid" id="grid"></div>

  <div class="scale">
    <span>тише</span>
    <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i>
    <i style="background:var(--l3)"></i><i style="background:var(--l4)"></i><i style="background:var(--l5)"></i>
    <span>плотнее</span><span class="sp"></span>
  </div>

  <div class="panel">
    <div class="row">
      <span class="d" id="pDate">—</span>
      <span class="load" id="pLoad">—</span>
    </div>
    <div class="bar" id="pBar"></div>
    <p id="pText"></p>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="sheet">
    <div class="grab"></div>
    <div class="year">
      <button class="nav" id="prevYear" aria-label="Предыдущий год">‹</button>
      <b id="pickYear">2026</b>
      <button class="nav" id="nextYear" aria-label="Следующий год">›</button>
    </div>
    <div class="months" id="months"></div>
    <button class="cancel" id="cancelBtn">Отмена</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var SHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  var GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  var LOADS=["свободно","спокойно","умеренно","плотно","занят","перегружен"];
  var NOTES=[
    "Можно взять что-то из бэклога.",
    "День почти пустой — хорошее время для отдыха.",
    "Обычная рабочая нагрузка.",
    "Стоит заранее разложить дела по времени.",
    "Много дел: часть лучше перенести.",
    "Перегруз — снимите хотя бы две задачи."
  ];

  function hash(y,m,d,salt){
    var x=((y*12+m)*32+d)*53+(salt||0);
    x=(x*2654435761)%4294967296; x=x^(x>>>12);
    return Math.abs(x)%100003;
  }
  // уровень загруженности 0..5
  function level(y,m,d){
    var h=hash(y,m,d,5);
    var wd=(new Date(y,m,d).getDay()+6)%7;
    var base=h%100;
    if(wd>4) base=Math.floor(base*0.55);        // выходные спокойнее
    if(base<28) return 0;
    if(base<45) return 1;
    if(base<62) return 2;
    if(base<78) return 3;
    if(base<92) return 4;
    return 5;
  }

  var today=new Date();
  var todayKey=today.getFullYear()+"-"+today.getMonth()+"-"+today.getDate();
  var viewY=today.getFullYear(), viewM=today.getMonth();
  var selY=viewY, selM=viewM, selD=today.getDate(), pickYear=viewY;

  var $=function(id){return document.getElementById(id);};
  var grid=$("grid"), overlay=$("overlay");

  (function(){
    var h="";
    for(var i=0;i<7;i++) h+="<span>"+WD[i]+"</span>";
    $("wd").innerHTML=h;
  })();

  function render(){
    $("mName").textContent=MONTHS[viewM];
    $("mYear").textContent=viewY+" год";

    var offset=(new Date(viewY,viewM,1).getDay()+6)%7;
    var start=new Date(viewY,viewM,1-offset);
    var days=new Date(viewY,viewM+1,0).getDate();
    var cells=Math.ceil((offset+days)/7)*7;

    grid.innerHTML="";
    for(var i=0;i<cells;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      var y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
      var out=m!==viewM, key=y+"-"+m+"-"+n;
      var lv=out?0:level(y,m,n);
      var b=document.createElement("button");
      b.type="button";
      b.className="cell"+(out?" out":(lv?" lv"+lv:""))+(key===todayKey?" today":"")
        +(y===selY&&m===selM&&n===selD?" sel":"");
      b.innerHTML='<span class="n">'+n+'</span>';
      b.dataset.y=y; b.dataset.m=m; b.dataset.d=n;
      grid.appendChild(b);
    }
    updatePanel();
  }

  function updatePanel(){
    var lv=level(selY,selM,selD);
    $("pDate").textContent=selD+" "+GEN[selM]+" "+selY;
    $("pLoad").textContent=LOADS[lv];
    $("pText").textContent=NOTES[lv]+" Задач на день: "+lv+".";
    var h="";
    for(var i=1;i<=5;i++) h+='<i class="'+(i<=lv?"on":"")+'"></i>';
    $("pBar").innerHTML=h;
  }

  grid.addEventListener("click",function(e){
    var b=e.target.closest(".cell");
    if(!b) return;
    selY=+b.dataset.y; selM=+b.dataset.m; selD=+b.dataset.d;
    if(selM!==viewM||selY!==viewY){ viewY=selY; viewM=selM; }
    render();
  });

  $("todayBtn").addEventListener("click",function(){
    viewY=today.getFullYear(); viewM=today.getMonth();
    selY=viewY; selM=viewM; selD=today.getDate(); render();
  });

  function monthLoad(y,m){
    var days=new Date(y,m+1,0).getDate(), s=0;
    for(var d=1;d<=days;d++) s+=level(y,m,d);
    return Math.min(5,Math.round(s/days*1.4));
  }
  function renderMonths(){
    $("pickYear").textContent=pickYear;
    var h="";
    for(var i=0;i<12;i++){
      var cls="";
      if(pickYear===viewY&&i===viewM) cls="cur";
      else if(pickYear===today.getFullYear()&&i===today.getMonth()) cls="now";
      var lv=monthLoad(pickYear,i);
      h+='<button type="button" class="'+cls+'" data-m="'+i+'">'+SHORT[i]
        +'<u style="background:var(--l'+lv+')"></u></button>';
    }
    $("months").innerHTML=h;
  }
  function open(){ pickYear=viewY; renderMonths(); overlay.classList.add("open"); }
  function close(){ overlay.classList.remove("open"); }

  $("monthBtn").addEventListener("click",open);
  $("prevYear").addEventListener("click",function(){pickYear--;renderMonths();});
  $("nextYear").addEventListener("click",function(){pickYear++;renderMonths();});
  $("cancelBtn").addEventListener("click",close);
  $("months").addEventListener("click",function(e){
    var b=e.target.closest("button[data-m]");
    if(!b) return;
    viewY=pickYear; viewM=+b.dataset.m; selY=viewY; selM=viewM;
    selD=(viewY===today.getFullYear()&&viewM===today.getMonth())?today.getDate():1;
    close(); render();
  });
  overlay.addEventListener("click",function(e){ if(e.target===overlay) close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });

  render();
})();
</script>
</body>
</html>
