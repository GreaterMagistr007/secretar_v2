<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>03. Северный лёд / заголовок-герой</title>
<style>
  /* Вариант 03: холодная сине-серая палитра, заголовок-герой на всю ширину */
  :root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --hero:#31465e;
    --line:#d6dee8;
    --text:#25313f;
    --muted:#7e8ea1;
    --accent:#4a7fb5;
    --accent-soft:#dde8f4;
    --weekend:#8895a8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.45 "Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  .screen{max-width:430px;min-width:320px;margin:0 auto;min-height:100vh;padding-bottom:26px;}

  /* Герой-заголовок */
  .hero{
    background:var(--hero);color:#fff;
    padding:calc(22px + env(safe-area-inset-top)) 20px 26px;
    border-radius:0 0 22px 22px;
  }
  .hero-kicker{
    font-size:11px;letter-spacing:3px;text-transform:uppercase;
    color:rgba(255,255,255,.62);margin-bottom:6px;
  }
  .hero-btn{
    width:100%;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;
    color:#fff;font-family:inherit;
    display:flex;align-items:baseline;gap:10px;
  }
  .hero-month{font-size:32px;font-weight:700;letter-spacing:-0.8px;}
  .hero-year{font-size:18px;font-weight:400;color:rgba(255,255,255,.7);}
  .hero-caret{margin-left:auto;font-size:14px;color:rgba(255,255,255,.7);}
  .hero-row{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .hero-nav{
    width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.26);
    background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:15px;line-height:1;
  }
  .hero-today{
    margin-left:auto;border:0;border-radius:999px;background:#fff;color:var(--hero);
    font:inherit;font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;
  }

  .panel{margin:-14px 12px 0;background:var(--surface);border-radius:16px;box-shadow:0 6px 18px rgba(37,49,63,.08);padding:14px 10px 16px;}
  .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);}
  .weekdays span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;padding-bottom:8px;}
  .weekdays span.we{color:#b0bcca;}
  .days{gap:3px;}
  .cell{
    position:relative;aspect-ratio:1/1;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;
    background:#f7f9fc;
  }
  .cell.out{background:transparent;color:#c5cfda;}
  .cell.we:not(.out){color:var(--weekend);}
  .cell.today{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(74,127,181,.35);}
  .badge{
    position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--accent-soft);color:var(--accent);
    font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .cell.today .badge{background:#fff;color:var(--accent);}

  .foot{margin:16px 20px 0;font-size:12px;color:var(--muted);}

  /* Модалка */
  .overlay{position:fixed;inset:0;background:rgba(37,49,63,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;}
  .overlay.open{display:flex;}
  .dialog{width:100%;max-width:370px;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(37,49,63,.3);}
  .d-top{background:var(--hero);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .d-title{font-size:14px;font-weight:600;}
  .y-nav{display:flex;align-items:center;gap:12px;}
  .y-btn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;}
  .y-val{font-size:16px;font-weight:700;min-width:56px;text-align:center;}
  .months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px;}
  .pick{padding:12px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;cursor:pointer;}
  .pick.now{border-color:var(--accent);color:var(--accent);}
  .pick.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .d-foot{padding:0 16px 16px;}
  .ghost{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<div class="screen">
  <div class="hero">
    <div class="hero-kicker">Календарь</div>
    <button class="hero-btn" id="titleBtn" type="button">
      <span class="hero-month" id="titleMonth">—</span>
      <span class="hero-year" id="titleYear">—</span>
      <span class="hero-caret">&#9662;</span>
    </button>
    <div class="hero-row">
      <button class="hero-nav" id="prev" type="button" aria-label="Предыдущий месяц">&#8249;</button>
      <button class="hero-nav" id="next" type="button" aria-label="Следующий месяц">&#8250;</button>
      <button class="hero-today" id="todayBtn" type="button">Сегодня</button>
    </div>
  </div>

  <div class="panel">
    <div class="weekdays" id="weekdays"></div>
    <div class="days" id="days"></div>
  </div>

  <div class="foot">Число в углу ячейки — количество задач на день.</div>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
    <div class="d-top">
      <span class="d-title">Перейти к месяцу</span>
      <div class="y-nav">
        <button class="y-btn" id="yearPrev" type="button" aria-label="Предыдущий год">&#8249;</button>
        <span class="y-val" id="yearVal">—</span>
        <button class="y-btn" id="yearNext" type="button" aria-label="Следующий год">&#8250;</button>
      </div>
    </div>
    <div class="months" id="months"></div>
    <div class="d-foot"><button class="ghost" id="cancelBtn" type="button">Отмена</button></div>
  </div>
</div>

<script>
(function(){
  var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var SHORT  = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  var WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  var today = new Date();
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var pickerYear = view.y;

  // Детерминированные демо-задачи
  function tasksFor(y, m, d){
    var h = Math.abs((y * 7919 + (m + 1) * 131 + d * 4099) % 101);
    if (h < 50) return 0;
    if (h < 74) return 1;
    if (h < 90) return 2;
    if (h < 97) return 3;
    return 5;
  }

  function buildCells(y, m){
    var offset = (new Date(y, m, 1).getDay() + 6) % 7;
    var dim = new Date(y, m + 1, 0).getDate();
    var prevDim = new Date(y, m, 0).getDate();
    var cells = [], i, d;
    for (i = offset - 1; i >= 0; i--) cells.push({ d: prevDim - i, out: true });
    for (d = 1; d <= dim; d++) cells.push({ d: d, out: false });
    d = 1;
    while (cells.length < 42) cells.push({ d: d++, out: true });
    return cells;
  }

  var daysEl = document.getElementById('days');
  var wdEl = document.getElementById('weekdays');

  WD.forEach(function(w, i){
    var s = document.createElement('span');
    s.textContent = w;
    if (i > 4) s.className = 'we';
    wdEl.appendChild(s);
  });

  function render(){
    document.getElementById('titleMonth').textContent = MONTHS[view.m];
    document.getElementById('titleYear').textContent = view.y;
    daysEl.innerHTML = '';
    buildCells(view.y, view.m).forEach(function(c, idx){
      var el = document.createElement('div');
      var cls = 'cell';
      if (c.out) cls += ' out';
      if (idx % 7 > 4) cls += ' we';
      var isToday = !c.out && c.d === today.getDate() && view.m === today.getMonth() && view.y === today.getFullYear();
      if (isToday) cls += ' today';
      el.className = cls;
      el.appendChild(document.createTextNode(c.d));

      var n = c.out ? 0 : tasksFor(view.y, view.m, c.d);
      if (n > 0) {
        var b = document.createElement('span');
        b.className = 'badge';
        b.textContent = n;
        el.appendChild(b);
      }
      daysEl.appendChild(el);
    });
  }

  function shift(delta){
    var m = view.m + delta;
    view.y += Math.floor(m / 12);
    view.m = ((m % 12) + 12) % 12;
    render();
  }

  document.getElementById('prev').addEventListener('click', function(){ shift(-1); });
  document.getElementById('next').addEventListener('click', function(){ shift(1); });
  document.getElementById('todayBtn').addEventListener('click', function(){
    view.y = today.getFullYear(); view.m = today.getMonth(); render();
  });

  /* Модалка выбора месяца */
  var overlay = document.getElementById('overlay');
  var monthsEl = document.getElementById('months');

  function renderPicker(){
    document.getElementById('yearVal').textContent = pickerYear;
    monthsEl.innerHTML = '';
    MONTHS.forEach(function(name, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = SHORT[i];
      var cls = 'pick';
      if (i === today.getMonth() && pickerYear === today.getFullYear()) cls += ' now';
      if (i === view.m && pickerYear === view.y) cls += ' active';
      b.className = cls;
      b.addEventListener('click', function(){
        view.y = pickerYear; view.m = i; closeModal(); render();
      });
      monthsEl.appendChild(b);
    });
  }

  function openModal(){ pickerYear = view.y; renderPicker(); overlay.classList.add('open'); }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('titleBtn').addEventListener('click', openModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('yearPrev').addEventListener('click', function(){ pickerYear--; renderPicker(); });
  document.getElementById('yearNext').addEventListener('click', function(){ pickerYear++; renderPicker(); });
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
