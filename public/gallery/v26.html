<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>26. Сине-серый / лента дней вместо сетки</title>
<style>
  /* Вариант 26 — календарь-лента: месяц сверху, ниже прокручиваемая колонка дней с задачами */
  :root{
    --bg:#eef1f6; --card:#fff; --ink:#1b2432; --dim:#7b8798; --line:#dde3ec;
    --accent:#3d5a80; --accentSoft:#e0e8f3; --weekend:#98a4b6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  /* Шапка */
  .head{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px 12px}
  .head button{width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font-family:inherit;
    display:flex;align-items:baseline;gap:9px}
  .head .m{font-size:26px;font-weight:700;letter-spacing:-.3px}
  .head .y{font-size:16px;color:var(--dim);font-weight:500}
  .head .cv{font-size:13px;color:var(--accent);margin-left:auto}
  .head .row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .head .meta{font-size:12px;color:var(--dim)}
  .tbtn{border:1px solid var(--line);background:var(--accentSoft);color:var(--accent);border-radius:8px;
    padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  /* Лента дней */
  .feed{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 30px}
  .day{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:7px;
    border-left:3px solid transparent}
  .day.has{border-left-color:var(--accent)}
  .day.today{background:#243b57;color:#fff;border-left-color:#7fa7d4}
  .day.weekend .dn,.day.weekend .dw{color:var(--weekend)}
  .dbox{flex:none;width:44px;text-align:center}
  .dn{font-size:21px;font-weight:700;line-height:1.05}
  .dw{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .day.today .dn,.day.today .dw{color:#fff}
  .tasks{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
  .task{font-size:13px;line-height:1.35;display:flex;align-items:center;gap:7px;color:var(--ink)}
  .day.today .task{color:#e8f0fb}
  .task i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--accent)}
  .day.today .task i{background:#9fc2e8}
  .task.p2 i{background:#c77b45}
  .task.p3 i{background:#5c8a5c}
  .empty{font-size:12px;color:#b3bdcb;font-style:italic}
  .day.today .empty{color:#93a8c4}
  .mstrip{flex:none;display:flex;gap:5px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);overflow-x:auto}
  .mstrip::-webkit-scrollbar{display:none}
  .mstrip button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;
    font-size:12px;color:var(--dim);cursor:pointer;font-family:inherit}
  .mstrip button.cur{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  /* Модалка */
  .ovl{position:fixed;inset:0;background:rgba(27,36,50,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
  .ovl.on{display:flex}
  .dlg{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:18px}
  .ynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ynav b{font-size:20px;font-weight:700}
  .ynav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--accent);font-size:18px;cursor:pointer}
  .mlist{display:flex;flex-direction:column;max-height:47vh;overflow-y:auto}
  .mlist button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 8px;
    font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;justify-content:space-between}
  .mlist button span{color:var(--dim);font-size:12px}
  .mlist button.cur{background:var(--accentSoft);color:var(--accent);font-weight:700;border-radius:8px}
  .cancel{margin-top:14px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:none;color:var(--dim);font-size:14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <button id="head" aria-haspopup="dialog">
      <span class="m" id="hMonth"></span><span class="y" id="hYear"></span><span class="cv">сменить ▾</span>
    </button>
    <div class="row2">
      <span class="meta" id="meta"></span>
      <button class="tbtn" id="tbtn">Сегодня</button>
    </div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="mstrip" id="mstrip"></div>
</div>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="Переход к месяцу">
  <div class="dlg">
    <div class="ynav">
      <button id="prevY" aria-label="Предыдущий год">‹</button>
      <b id="yLbl"></b>
      <button id="nextY" aria-label="Следующий год">›</button>
    </div>
    <div class="mlist" id="mlist"></div>
    <button class="cancel" id="cancel">Отмена</button>
  </div>
</div>

<script>
  const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MSHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const TITLES=['Созвон с командой','Купить продукты','Отчёт за неделю','Тренировка','Оплатить счета',
    'Встреча с клиентом','Забрать посылку','Прочитать главу','Позвонить маме','Ревью кода',
    'Записаться к врачу','Прогулка в парке','Разобрать почту','Планёрка','Резервная копия'];
  const today=new Date();
  let vy=today.getFullYear(), vm=today.getMonth(), pickY=vy;

  function rnd(y,m,d,k){const x=Math.sin((y*12+m)*13.7+d*8.11+k*2.7)*10000;return x-Math.floor(x);}
  function tasksOf(y,m,d){
    const n=rnd(y,m,d,0)<.4?0:1+Math.floor(rnd(y,m,d,1)*10)%3;
    const out=[];
    for(let k=0;k<n;k++) out.push({t:TITLES[Math.floor(rnd(y,m,d,k+2)*TITLES.length)],p:1+Math.floor(rnd(y,m,d,k+9)*3)});
    return out;
  }

  function draw(){
    document.getElementById('hMonth').textContent=MONTHS[vm];
    document.getElementById('hYear').textContent=vy;
    const dim=new Date(vy,vm+1,0).getDate();
    let html='',total=0;
    for(let d=1;d<=dim;d++){
      const wd=(new Date(vy,vm,d).getDay()+6)%7;
      const list=tasksOf(vy,vm,d); total+=list.length;
      const isT=(d===today.getDate()&&vm===today.getMonth()&&vy===today.getFullYear());
      const body=list.length
        ? list.map(x=>'<div class="task p'+x.p+'"><i></i><span>'+x.t+'</span></div>').join('')
        : '<div class="empty">нет задач</div>';
      html+='<div class="day'+(isT?' today':'')+(list.length?' has':'')+(wd>4?' weekend':'')+'">'+
            '<div class="dbox"><div class="dn">'+d+'</div><div class="dw">'+WD[wd]+'</div></div>'+
            '<div class="tasks">'+body+'</div></div>';
    }
    document.getElementById('feed').innerHTML=html;
    document.getElementById('meta').textContent=dim+' дней · '+total+' задач';
    document.getElementById('mstrip').innerHTML=MSHORT.map((m,i)=>
      '<button data-sm="'+i+'" class="'+(i===vm?'cur':'')+'">'+m+'</button>').join('');
    const cur=document.querySelector('.mstrip button.cur');
    if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
    const tEl=document.querySelector('.day.today');
    if(tEl) tEl.scrollIntoView({block:'center'});
  }

  function drawMonths(){
    document.getElementById('yLbl').textContent=pickY;
    document.getElementById('mlist').innerHTML=MONTHS.map((m,i)=>{
      const dim=new Date(pickY,i+1,0).getDate();
      return '<button data-m="'+i+'" class="'+(i===vm&&pickY===vy?'cur':'')+'">'+m+'<span>'+dim+' дн.</span></button>';
    }).join('');
  }

  const ovl=document.getElementById('ovl');
  const open=()=>{pickY=vy;drawMonths();ovl.classList.add('on');};
  const close=()=>ovl.classList.remove('on');

  document.getElementById('head').addEventListener('click',open);
  document.getElementById('cancel').addEventListener('click',close);
  ovl.addEventListener('click',e=>{if(e.target===ovl)close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ovl.classList.contains('on'))close();});
  document.getElementById('prevY').addEventListener('click',()=>{pickY--;drawMonths();});
  document.getElementById('nextY').addEventListener('click',()=>{pickY++;drawMonths();});
  document.getElementById('mlist').addEventListener('click',e=>{
    const b=e.target.closest('button[data-m]');if(!b)return;
    vm=+b.dataset.m;vy=pickY;draw();close();
  });
  document.getElementById('mstrip').addEventListener('click',e=>{
    const b=e.target.closest('button[data-sm]');if(!b)return;
    vm=+b.dataset.sm;draw();
  });
  document.getElementById('tbtn').addEventListener('click',()=>{vy=today.getFullYear();vm=today.getMonth();draw();});

  draw();
</script>
</body>
</html>
